<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caronte</title>
<style>
/* --------------------------------------------------------------------------
   Caratteri

   DM Sans, variabile, servita dal disco: gli stessi file che compongono il CV.
   Niente CDN, così il pannello funziona senza rete e nessuno fuori di qui sa
   che lo stai aprendo.
   -------------------------------------------------------------------------- */
@font-face {
  font-family: 'DM Sans';
  src: url('/fonts/dm-sans-latin.woff2') format('woff2');
  font-weight: 100 1000; font-style: normal; font-display: swap;
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'DM Sans';
  src: url('/fonts/dm-sans-latin-ext.woff2') format('woff2');
  font-weight: 100 1000; font-style: normal; font-display: swap;
  unicode-range: U+0100-02AF, U+0304, U+0308, U+0329, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
}

/* --------------------------------------------------------------------------
   Tinte

   Dall'emblema: grotta di ardesia verde-azzurra, acqua che illumina da sotto.
   Della grotta l'interfaccia prende solo la plancia in alto, che è l'unica
   superficie scura: il pannello si usa di giorno, alla scrivania. Carta
   pallida virata sul verde-acqua, inchiostro di ardesia, mai bianco e mai
   nero. Un accento solo, acqua profonda, per tre cose: l'azione principale,
   la fase scelta, l'anello di fuoco. Mai decorazione.
   -------------------------------------------------------------------------- */
:root {
  --paper:        oklch(0.980 0.005 200);
  --paper-sunk:   oklch(0.957 0.009 200);
  --paper-raised: oklch(0.995 0.003 200);
  --rule:         oklch(0.898 0.011 200);
  --rule-strong:  oklch(0.812 0.016 202);
  --ink:          oklch(0.250 0.034 218);
  --ink-soft:     oklch(0.468 0.027 212);
  --ink-faint:    oklch(0.622 0.020 207);
  --accent:       oklch(0.440 0.100 207);
  --accent-press: oklch(0.368 0.092 209);
  --accent-wash:  oklch(0.948 0.032 200);

  --deep:         oklch(0.214 0.044 221);
  --deep-up:      oklch(0.268 0.046 219);
  --deep-rule:    oklch(0.352 0.044 212);
  --bone:         oklch(0.944 0.014 190);
  --bone-soft:    oklch(0.735 0.024 198);
  --glow:         oklch(0.852 0.108 191);

  --sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, monospace;

  --t-xs:   0.75rem;
  --t-sm:   0.8125rem;
  --t-base: 0.9375rem;
  --t-md:   1.0625rem;
  --t-lg:   1.375rem;
  --t-xl:   1.875rem;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 170ms;
  --pad: clamp(1.25rem, 4vw, 2.5rem);
}

*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 var(--t-base)/1.55 var(--sans);
  font-feature-settings: 'ss01';
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
}

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.wrap { max-width: 74rem; margin: 0 auto; padding-inline: var(--pad); }

.sr {
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}

h1, h2, h3, h4 { font-weight: 600; letter-spacing: -0.014em; margin: 0; }

/* ==========================================================================
   Plancia — fissa in alto, non si chiude mai
   ========================================================================== */
.board {
  position: sticky; top: 0; z-index: 20;
  background: var(--deep);
  color: var(--bone);
  box-shadow: 0 1px 0 var(--deep-rule), 0 6px 20px -14px oklch(0.2 0.04 220 / 0.6);
}
.board :focus-visible { outline-color: var(--glow); }

.crest { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 0 0.5rem; }
/* L'emblema nelle sue proporzioni 4:5. Il nome gli sta di fianco, quindi è
   decorativo e l'alt resta vuoto: letto ad alta voce raddoppierebbe "Caronte". */
.crest img {
  width: 2rem; height: 2.5rem; object-fit: cover; border-radius: 4px;
  box-shadow: 0 0 0 1px color-mix(in oklch, var(--glow) 30%, transparent);
}
.crest h1 { font-size: var(--t-md); font-weight: 650; color: var(--bone); }
.crest .claim { font-size: var(--t-xs); color: var(--bone-soft); }
.crest .spacer { flex: 1; }

/* Le cinque fasi. La posizione porta il significato, la parola lo conferma,
   il colore non informa. Scorre di lato sugli schermi stretti. */
.track {
  display: flex; gap: 0;
  overflow-x: auto; scrollbar-width: none;
  scroll-snap-type: x proximity;
  border-top: 1px solid var(--deep-rule);
}
.track::-webkit-scrollbar { display: none; }

.step {
  appearance: none; border: 0; background: none; cursor: pointer;
  font: inherit; color: var(--bone-soft); text-align: left;
  flex: 1 0 auto; min-width: 8.5rem;
  scroll-snap-align: start;
  padding: 0.6875rem 1.125rem 0.75rem 0;
  display: grid; gap: 0.1875rem;
  border-bottom: 2px solid transparent;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.step:hover { color: var(--bone); }
.step-top { display: flex; align-items: baseline; gap: 0.5rem; }
.step-n {
  font-size: var(--t-xs); font-weight: 500;
  font-variant-numeric: tabular-nums;
  opacity: 0.55;
}
.step-name { font-size: var(--t-sm); font-weight: 550; letter-spacing: -0.006em; }
.step-sub { font-size: var(--t-xs); line-height: 1.35; opacity: 0.78; }
.step-sub .now { font-weight: 600; color: var(--glow); opacity: 1; }
/* Scelta: la barra piena sotto, e il nome in chiaro. Due segni, nessuno dei
   due è il colore da solo. */
.step[aria-pressed="true"] { color: var(--bone); border-bottom-color: var(--glow); }
.step[aria-pressed="true"] .step-name { font-weight: 680; }
.step[aria-pressed="true"] .step-n { opacity: 0.85; }
.step:focus-visible { outline-offset: -3px; }

/* ==========================================================================
   Riga di servizio — profilo e ripristino, fuori dalla strada
   ========================================================================== */
.util { border-bottom: 1px solid var(--rule); background: var(--paper-sunk); }
.util-in { display: flex; align-items: center; gap: 1.5rem; min-height: 2.625rem; }

.link {
  appearance: none; border: 0; background: none; cursor: pointer;
  font: 500 var(--t-sm)/1 var(--sans); color: var(--ink-soft);
  padding: 0.5rem 0; display: inline-flex; align-items: center; gap: 0.4375rem;
  transition: color var(--dur) var(--ease);
}
.link:hover { color: var(--ink); }
.link[hidden] { display: none; }
/* Un solo gesto, un solo vocabolario: la parola cambia con lo stato. */
.link .chiuso, .link .aperto { display: none; }
:not([open]) > summary .link .chiuso, [aria-expanded="false"] .chiuso { display: inline; }
[open] > summary .link .aperto, [aria-expanded="true"] .aperto { display: inline; }

/* Il segno di apertura: due righe da 1px, come tutto il resto della pagina.
   La gamba verticale sparisce quando il blocco è aperto. Nessun glifo. */
.caret { position: relative; display: block; width: 0.625rem; height: 0.625rem; }
.caret::before, .caret::after { content: ''; position: absolute; background: currentColor; }
.caret::before { left: 0; right: 0; top: 50%; height: 1px; transform: translateY(-0.5px); }
.caret::after {
  top: 0; bottom: 0; left: 50%; width: 1px;
  transform: translateX(-0.5px) scaleY(1);
  transition: transform var(--dur) var(--ease);
}
[open] > summary .caret::after, [aria-expanded="true"] .caret::after { transform: translateX(-0.5px) scaleY(0); }

/* ==========================================================================
   Profilo
   ========================================================================== */
.io { display: none; border-bottom: 1px solid var(--rule); background: var(--paper-sunk); }
.io[data-open="yes"] { display: block; }
.io-in { padding: 1.75rem 0 2.5rem; }

.io-lead {
  font-size: var(--t-md); line-height: 1.5; font-weight: 450;
  max-width: 60ch; margin: 0 0 1.75rem;
  letter-spacing: -0.008em;
}
.io-lead b { font-weight: 650; }

.io-grid { display: grid; grid-template-columns: minmax(10rem, 15rem) minmax(0, 1fr); gap: 0 2.5rem; align-items: start; }

.io-tabs { display: flex; flex-direction: column; gap: 1px; }
.io-tab {
  appearance: none; border: 0; cursor: pointer; text-align: left;
  font: 500 var(--t-sm)/1.3 var(--sans); color: var(--ink-soft);
  background: none; padding: 0.5rem 0.625rem; border-radius: 5px;
  display: flex; align-items: baseline; gap: 0.5rem;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.io-tab:hover { background: var(--paper-raised); color: var(--ink); }
.io-tab[aria-selected="true"] { background: var(--ink); color: var(--paper); font-weight: 600; }
.io-tab .n { font-size: var(--t-xs); font-variant-numeric: tabular-nums; opacity: 0.6; margin-left: auto; }

.io-panel h3 {
  font-size: var(--t-base); font-weight: 650; margin-bottom: 0.875rem;
}
.io-panel p { margin: 0 0 0.875rem; font-size: var(--t-sm); line-height: 1.65; max-width: 62ch; color: var(--ink-soft); }
.io-panel ul { margin: 0; padding: 0; list-style: none; max-width: 64ch; }
.io-panel li {
  font-size: var(--t-sm); line-height: 1.6;
  padding: 0.5rem 0 0.5rem 1.125rem; text-indent: -1.125rem;
  border-top: 1px solid var(--rule);
  color: var(--ink-soft);
}
.io-panel li::before { content: '·'; display: inline-block; width: 1.125rem; text-indent: 0; color: var(--ink-faint); }
.io-panel li b { font-weight: 640; color: var(--ink); }
/* I divieti non sono qualità in meno: sono il perimetro entro cui tutto il
   resto è vero. Segno diverso, parola diversa. */
.io-panel[data-guard="yes"] li::before { content: '✗'; color: var(--ink); }

@media (max-width: 52rem) {
  .io-grid { grid-template-columns: 1fr; gap: 1.25rem; }
  .io-tabs { flex-direction: row; flex-wrap: wrap; }
  .io-tab .n { display: none; }
}

/* ==========================================================================
   Pannello della fase
   ========================================================================== */
main { padding-bottom: 5rem; }

.act { padding: 2.25rem 0 0; }
.act-head { max-width: 58ch; margin-bottom: 1.375rem; }
.act-head h2 { font-size: var(--t-xl); line-height: 1.15; letter-spacing: -0.026em; }
.act-head p { margin: 0.5rem 0 0; font-size: var(--t-base); line-height: 1.55; color: var(--ink-soft); }

.act-bar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }

button {
  font: 550 var(--t-sm)/1 var(--sans);
  padding: 0.625rem 1rem;
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  background: var(--paper-raised);
  color: var(--ink);
  cursor: pointer;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
button:hover:not(:disabled) { background: var(--paper-sunk); border-color: var(--ink-faint); }
button:active:not(:disabled) { background: var(--rule); }
button:disabled { color: var(--ink-faint); border-color: var(--rule); cursor: not-allowed; }

button.primary {
  background: var(--accent); border-color: var(--accent); color: var(--paper);
  font-weight: 600; padding-inline: 1.25rem;
}
button.primary:hover:not(:disabled) { background: var(--accent-press); border-color: var(--accent-press); }
button.primary:disabled { background: var(--rule); border-color: var(--rule); color: var(--ink-faint); }

button.quiet { border-color: transparent; background: transparent; color: var(--ink-soft); padding-inline: 0.625rem; }
button.quiet:hover:not(:disabled) { background: var(--paper-sunk); color: var(--ink); }

button[data-busy="yes"] { color: var(--ink-faint); }

.qty { display: inline-flex; align-items: center; gap: 0.5rem; font-size: var(--t-sm); color: var(--ink-soft); }
.qty input {
  width: 4.5rem;
  font: 550 var(--t-sm)/1 var(--sans); font-variant-numeric: tabular-nums;
  padding: 0.5625rem 0.625rem;
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  background: var(--paper-raised);
  color: var(--ink);
}

/* I filtri: una riga per domanda, l'etichetta sempre nella stessa colonna,
   così le risposte si leggono incolonnate invece che a zig-zag. */
.filtri {
  flex: 1 0 100%;
  margin-top: 1.5rem; padding-top: 1.375rem;
  border-top: 1px solid var(--rule);
  display: grid; gap: 0.625rem;
}
.frow { display: flex; align-items: center; gap: 0.4375rem; flex-wrap: wrap; }
.fname {
  flex: 0 0 5.25rem;
  font: 500 var(--t-xs)/1 var(--sans);
  letter-spacing: 0.055em; text-transform: uppercase;
  color: var(--ink-faint);
}
.chip {
  font: 500 var(--t-xs)/1 var(--sans);
  padding: 0.4375rem 0.75rem;
  border-radius: 999px;
  border-color: var(--rule);
}
/* Scelto si vede dal pieno, non dalla tinta. */
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip[aria-pressed="true"]:hover { background: var(--ink); color: var(--paper); }

.focus { display: flex; flex: 1; min-width: 14rem; }
.focus input {
  flex: 1; min-width: 0;
  font: 400 var(--t-sm)/1.3 var(--sans);
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--paper-raised);
  color: var(--ink);
}
.focus input::placeholder { color: var(--ink-faint); }

/* ==========================================================================
   Conferma — in linea, mai una finestra sopra la pagina
   ========================================================================== */
.panel {
  border: 1px solid var(--ink);
  border-radius: 10px;
  background: var(--paper-raised);
  padding: 1.5rem;
  margin-top: 2rem;
}
.panel > .kicker {
  font: 600 var(--t-xs)/1 var(--sans);
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--ink-faint);
  display: block; margin-bottom: 0.625rem;
}
.panel h3 { font-size: var(--t-lg); letter-spacing: -0.02em; }
.panel > p { margin: 0.5rem 0 0; color: var(--ink-soft); max-width: 62ch; }

.facts { margin: 1.375rem 0 0; display: grid; gap: 0; }
.fact {
  display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: 1rem;
  padding: 0.5625rem 0; border-top: 1px solid var(--rule);
  font-size: var(--t-sm);
}
.fact dt { margin: 0; color: var(--ink-faint); font-weight: 500; }
.fact dd { margin: 0; min-width: 0; color: var(--ink-soft); }
.fact dd b { color: var(--ink); font-weight: 620; }
code {
  font: 400 0.9em/1.6 var(--mono);
  background: var(--paper-sunk); border: 1px solid var(--rule);
  padding: 0.0625rem 0.3125rem; border-radius: 4px;
  overflow-wrap: anywhere;
}

.warn {
  margin-top: 1.25rem;
  font-size: var(--t-sm); line-height: 1.55;
  padding: 0.75rem 0.875rem;
  border: 1px solid var(--rule-strong);
  background: var(--paper-sunk);
  border-radius: 6px;
  max-width: 68ch;
}
.warn b { font-weight: 640; }

.panel-actions { display: flex; gap: 0.625rem; align-items: center; margin-top: 1.5rem; flex-wrap: wrap; }

/* L'errore non usa un secondo colore: usa l'inchiostro pieno e le parole. */
.panel.fail { border-width: 2px; }
.tags { display: flex; gap: 0.375rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
.tag {
  font: 600 var(--t-xs)/1 var(--sans);
  text-transform: uppercase; letter-spacing: 0.06em;
  padding: 0.3125rem 0.5rem; border-radius: 4px;
  background: var(--ink); color: var(--paper);
}
.tag.open { background: none; color: var(--ink-soft); border: 1px solid var(--rule-strong); }

details.raw { margin-top: 1.375rem; border-top: 1px solid var(--rule); padding-top: 0.875rem; }
details.raw > summary {
  cursor: pointer; list-style: none;
  font: 600 var(--t-xs)/1 var(--sans);
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint);
}
details.raw > summary::-webkit-details-marker { display: none; }
details.raw > summary:hover { color: var(--ink); }
details.raw pre {
  font: 400 var(--t-xs)/1.6 var(--mono);
  background: var(--paper-sunk); color: var(--ink-soft);
  border: 1px solid var(--rule);
  padding: 0.875rem; border-radius: 6px;
  max-height: 17rem; overflow: auto;
  margin: 0.875rem 0 0; white-space: pre-wrap; word-break: break-word;
}

/* ==========================================================================
   Registro di esecuzione
   ========================================================================== */
.run { margin-top: 2rem; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.run-head {
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.6875rem 1rem;
  background: var(--paper-sunk);
  border-bottom: 1px solid var(--rule);
  font: 600 var(--t-xs)/1 var(--sans);
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft);
}
/* Il battito dice "sta girando" a chi guarda; la parola lo dice a tutti. */
.run-head .beat {
  width: 0.4375rem; height: 0.4375rem; border-radius: 50%;
  background: var(--ink-faint);
}
.run[data-live="yes"] .run-head .beat { background: var(--accent); animation: beat 1.4s var(--ease) infinite; }
@keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
.run-log {
  font: 400 var(--t-xs)/1.7 var(--mono);
  color: var(--ink-soft);
  max-height: 12rem; overflow-y: auto;
  white-space: pre-wrap; word-break: break-word;
  padding: 0.75rem 1rem;
}
.run-log .cur { color: var(--ink); font-weight: 500; }

/* ==========================================================================
   Gli annunci
   ========================================================================== */
.group { margin-top: 3rem; }
.group:first-child { margin-top: 2.75rem; }
details.group > summary { cursor: pointer; list-style: none; }
details.group > summary::-webkit-details-marker { display: none; }

.group-head {
  display: flex; align-items: baseline; gap: 0.625rem;
  padding-bottom: 0.625rem;
  border-bottom: 1px solid var(--ink);
}
.group-head h2 {
  font-size: var(--t-xs); font-weight: 650;
  text-transform: uppercase; letter-spacing: 0.1em;
}
.group-head .n {
  font-size: var(--t-xs); font-variant-numeric: tabular-nums;
  color: var(--ink-faint);
}
.group-head .link { margin-left: auto; padding-block: 0; }

.row {
  display: grid;
  grid-template-columns: 3.25rem minmax(0, 1fr) auto;
  gap: 0 1.25rem;
  align-items: start;
  padding: 0.9375rem 0.5rem 0.9375rem 0;
  border-bottom: 1px solid var(--rule);
  transition: background var(--dur) var(--ease);
}
.row:hover { background: var(--paper-raised); }

/* Il voto, o la percentuale quando l'annuncio è stato letto per intero. Due
   numeri sulla stessa riga sarebbero due verdetti e nessuno saprebbe a quale
   credere: quando arriva la percentuale, il voto passa nel suggerimento. */
.score {
  font-size: var(--t-lg); font-weight: 600; line-height: 1.15;
  font-variant-numeric: tabular-nums; letter-spacing: -0.03em;
  text-align: right; padding-top: 0.0625rem;
}
.score[data-none="yes"] { font-size: var(--t-sm); font-weight: 400; color: var(--ink-faint); }
.score[data-kind="fit"] { font-size: var(--t-md); }
.score[data-kind="blocked"] { font-size: var(--t-sm); font-weight: 500; color: var(--ink-soft); }

.who { min-width: 0; }
/* Il ruolo per primo, ed è la cosa più grande della riga: è quello che stai
   cercando. Azienda e luogo vengono dopo, sulla riga sotto. */
.who h3 { font-size: var(--t-md); line-height: 1.3; letter-spacing: -0.016em; }
.who .meta {
  display: flex; align-items: baseline; gap: 0.4375rem; flex-wrap: wrap;
  margin-top: 0.1875rem;
  font-size: var(--t-sm); color: var(--ink-soft);
}
.who .meta a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule-strong); }
.who .meta a:hover { color: var(--accent); border-bottom-color: var(--accent); }
.who .meta .sep { color: var(--rule-strong); }
/* Una descrizione breve, presa dall'annuncio. Due righe al massimo: la terza
   sarebbe già lettura, e per leggere c'è la tendina. */
.who .teaser {
  margin: 0.375rem 0 0; max-width: 72ch;
  font-size: var(--t-sm); line-height: 1.55; color: var(--ink-soft);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Ogni stato porta la parola. Il segno la raddoppia per chi non distingue i
   colori, e nessuno dei due è il colore. */
.state { display: inline-flex; align-items: center; gap: 0.375rem; font-weight: 600; font-size: var(--t-xs); }
.state::before { content: ''; width: 0.5rem; height: 0.5rem; border: 1.5px solid var(--ink-soft); }
.state[data-k="chosen"]::before    { background: var(--ink-soft); }
.state[data-k="partial"]::before   { background: linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); }
.state[data-k="skipped"]::before   { border-radius: 50%; background: none; }
.state[data-k="opened"]::before    { border-radius: 50%; background: var(--ink-soft); }
.state[data-k="submitted"]::before { background: var(--ink); border-color: var(--ink); border-radius: 50%; }
.state[data-k="dead"]::before      { background: repeating-linear-gradient(45deg, var(--ink-faint) 0 2px, transparent 2px 4px); }

.pick { display: flex; gap: 0.375rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.pick button { padding: 0.4375rem 0.75rem; font-size: var(--t-xs); }
.pick button.primary { background: var(--paper-raised); border-color: var(--accent); color: var(--accent); }
.pick button.primary:hover:not(:disabled) { background: var(--accent-wash); color: var(--accent-press); }
.pick button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

/* La tendina: tutto il resto sta qui dentro, chiuso. Su venti righe, aperto,
   sarebbe un muro. */
.more { grid-column: 2 / -1; margin-top: 0.375rem; }
.more > summary {
  list-style: none; cursor: pointer; width: fit-content;
  font: 500 var(--t-xs)/1 var(--sans); color: var(--ink-faint);
  display: inline-flex; align-items: center; gap: 0.4375rem;
  padding: 0.1875rem 0;
  transition: color var(--dur) var(--ease);
}
.more > summary::-webkit-details-marker { display: none; }
.more > summary:hover { color: var(--ink); }
.more-body { padding-top: 0.875rem; max-width: 74ch; }
.more-body .sintesi { margin: 0 0 1rem; font-size: var(--t-sm); line-height: 1.6; }

.pairs { display: grid; gap: 0; margin: 0 0 1rem; }
.pair {
  display: grid; grid-template-columns: 8.5rem minmax(0, 1fr); gap: 0.75rem;
  padding: 0.4375rem 0; border-top: 1px solid var(--rule);
  font-size: var(--t-sm);
}
.pair dt { margin: 0; color: var(--ink-faint); }
.pair dd { margin: 0; min-width: 0; color: var(--ink-soft); overflow-wrap: anywhere; }
.pair dd a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in oklch, var(--accent) 35%, transparent); }
.pair dd a:hover { border-bottom-color: var(--accent); }

.req { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr); gap: 0 0.625rem; padding: 0.5rem 0; border-top: 1px solid var(--rule); }
.req .mark { font: 400 var(--t-sm)/1.5 var(--mono); color: var(--ink-soft); text-align: center; }
.req q { font-size: var(--t-sm); line-height: 1.5; quotes: '"' '"'; }
.req .nota { font-size: var(--t-xs); color: var(--ink-soft); line-height: 1.5; margin: 0.1875rem 0 0; }
.req .nota b { font-weight: 640; color: var(--ink); }

.agganci { margin-top: 1rem; border-top: 1px solid var(--rule-strong); padding-top: 0.75rem; }
.agganci h4 { font: 500 var(--t-xs)/1 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 0.625rem; }
.agganci ul { margin: 0; padding: 0; list-style: none; }
.agganci li { font-size: var(--t-sm); line-height: 1.55; margin-bottom: 0.4375rem; }
.agganci li span { color: var(--ink-soft); }

/* ==========================================================================
   Le fonti — chiuse, perché sono configurazione, non lavoro del giorno
   ========================================================================== */
.fonte {
  display: grid; grid-template-columns: minmax(0, 1fr) auto;
  gap: 0 1rem; align-items: baseline;
  padding: 0.5rem 0; border-top: 1px solid var(--rule);
  font-size: var(--t-sm);
}
.fonte-nome { font-weight: 550; }
.fonte-esempi { color: var(--ink-faint); font-weight: 400; font-size: var(--t-xs); }
.fonte-n { font-size: var(--t-xs); color: var(--ink-faint); font-variant-numeric: tabular-nums; }

.say { margin: 0.875rem 0 0; font-size: var(--t-sm); color: var(--ink-soft); max-width: 68ch; }

/* ==========================================================================
   Vuoto e caricamento
   ========================================================================== */
.blank { padding: 3rem 0 4rem; max-width: 56ch; }
.blank h2 { font-size: var(--t-lg); letter-spacing: -0.02em; }
.blank p { margin: 0.75rem 0 1.5rem; color: var(--ink-soft); }
.blank ol { margin: 0; padding: 0; list-style: none; counter-reset: s; }
.blank li {
  counter-increment: s;
  display: grid; grid-template-columns: 1.75rem minmax(0, 1fr); gap: 0.5rem;
  padding: 0.6875rem 0; border-top: 1px solid var(--rule);
  font-size: var(--t-sm); color: var(--ink-soft);
}
.blank li::before {
  content: '0' counter(s);
  font-variant-numeric: tabular-nums; color: var(--ink-faint);
}
.blank li b { color: var(--ink); font-weight: 620; }

.skel { border-bottom: 1px solid var(--rule); padding: 1.125rem 0; display: grid; grid-template-columns: 3.25rem 1fr; gap: 1.25rem; }
.skel i { display: block; height: 0.75rem; border-radius: 3px; background: var(--rule); }
.skel i + i { margin-top: 0.5625rem; width: 58%; }
.skel i:first-child { width: 2rem; margin-left: auto; }

@media (max-width: 52rem) {
  .row { grid-template-columns: 3rem minmax(0, 1fr); }
  .pick { grid-column: 1 / -1; padding-top: 0.875rem; justify-content: flex-start; }
  .fact, .pair { grid-template-columns: 1fr; gap: 0.125rem; }
  .act-head h2 { font-size: var(--t-lg); }
}
</style>
</head>
<body>

<header class="board">
  <div class="wrap">
    <div class="crest">
      <img src="/caronte.jpg" alt="" width="32" height="40">
      <h1>Caronte</h1>
      <span class="claim">L'ultimo passo lo fai tu</span>
    </div>
    <nav class="track" id="track" aria-label="Le cinque fasi"></nav>
  </div>
</header>

<div class="util">
  <div class="wrap util-in">
    <button class="link" id="io-toggle" aria-expanded="false" aria-controls="io">
      Il mio profilo <i class="caret" aria-hidden="true"></i>
    </button>
    <button class="link" id="restore" hidden>Ripristina la coda</button>
  </div>
</div>

<section class="io" id="io" data-open="no">
  <div class="wrap io-in" id="io-in">carico…</div>
</section>

<main class="wrap">
  <div id="setup"></div>
  <section class="act" id="act"></section>
  <div id="confirm"></div>
  <div id="run"></div>
  <div id="fail"></div>
  <div id="list"></div>
</main>

<script>
'use strict';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

let state = null;
let pending = null;   // conferma in attesa
let poll = null;      // id dell'intervallo di polling
let busy = false;
// La fase su cui punta il pannello. Parte da quella consigliata, ma la plancia
// può spostarla su qualunque altra.
let selected = null;

// Una casella, un numero. Due numeri per casella obbligavano a leggere invece
// che a guardare, ed era il contrario del punto di una plancia.
const STAGES = [
  { id: 'search', name: 'Cerca',     count: (s) => `${s.inPlay} in gioco` },
  { id: 'triage', name: 'Valuta',    count: (s) => `${s.readyToTriage} da valutare` },
  { id: 'deep',   name: 'Analizza',  count: (s) => `${s.toAnalyse} da leggere` },
  { id: 'packs',  name: 'Documenti', count: (s) => `${s.packsBuilt} pronti` },
  { id: 'form',   name: 'Compila',   count: (s) => `${s.submitted} inviate` },
];

// Il livello di rischio va detto a parole: "medium" non significa niente per
// chi legge, e il colore non può portarlo da solo.
const RISK = {
  low: 'basso — tocca solo file di lavoro, si torna indietro',
  medium: 'medio — consuma token e riscrive i punteggi in coda',
  high: 'alto — apre un sito esterno e digita nei suoi campi. Non invia.',
};

/**
 * Una parola sola per la località.
 *
 * "United States · Ireland · Spain · Australia · Japan · Brazil · Italy ·
 * Poland · ..." occupava due righe e non rispondeva alla sola domanda che
 * conta: ci arrivo da Milano? L'elenco completo resta nella tendina.
 */
function dove(loc) {
  const l = String(loc || '');
  if (!l.trim()) return '';
  if (/milan/i.test(l)) return 'Milano';
  if (/ital/i.test(l)) return 'Italia';
  if (/europ|emea|ireland|spain|poland|german|france|paris|berlin|london|united kingdom|portugal|netherlands|serbia/i.test(l)) return 'Europa';
  if (/remote/i.test(l)) return 'Remoto';
  return 'Fuori Europa';
}

const STATE_WORD = {
  chosen: 'scelto', partial: 'solo documenti', skipped: 'ignorato',
  opened: 'form aperto', submitted: 'inviato', dead: 'chiuso',
};

async function api(path, opts) {
  const res = await fetch(path, {
    method: opts ? 'POST' : 'GET',
    headers: opts ? { 'Content-Type': 'application/json' } : undefined,
    body: opts ? JSON.stringify(opts) : undefined,
  });
  return { status: res.status, body: await res.json() };
}

// ---------------------------------------------------------------------------
// Plancia
// ---------------------------------------------------------------------------

/**
 * Ogni casella della plancia sceglie la sua fase.
 *
 * Il consiglio resta — la fase consigliata porta scritto "adesso" — ma non è
 * un cancello: prima si poteva solo fare il passo successivo, e così non si
 * rilanciava una ricerca finché c'erano annunci da valutare.
 */
function drawTrack() {
  const s = state.stats;
  $('track').innerHTML = STAGES.map((st, i) => `
    <button class="step" data-stage="${esc(st.id)}" aria-pressed="${selected === st.id}">
      <span class="step-top">
        <span class="step-n">0${i + 1}</span>
        <span class="step-name">${esc(st.name)}</span>
      </span>
      <span class="step-sub">${esc(st.count(s))}${
        state.next === st.id ? ' <span class="now">· adesso</span>' : ''
      }</span>
    </button>`).join('');

  document.querySelectorAll('[data-stage]').forEach((b) => b.addEventListener('click', () => {
    selected = b.dataset.stage;
    $('confirm').innerHTML = '';
    drawTrack();
    drawAct();
    // La lista cambia con la fase: su Cerca mostra le fonti, altrove i ruoli.
    drawList();
  }));
}

/**
 * Una frase che dice cosa succede in questa fase.
 *
 * Costo, file toccati e rischio non stanno qui: stanno nella conferma, che è
 * dove servono davvero. Ripeterli in ogni schermata li rendeva rumore.
 */
const SPIEGA = {
  search: () => {
    const n = quanti === null ? 5 : quanti;
    if (n === 0) return 'Con zero non importa niente. Scrivi quanti annunci vuoi cercare.';
    const etichette = focusLabels();
    const dove = etichette.length ? `, fra quelli che parlano di ${etichette.join(', ')}` : '';
    return `Cerca ${n === 1 ? 'un annuncio' : `${n} annunci`}${dove}, uno per portale a turno.`;
  },
  triage: (s) => {
    const n = quanti === null ? s.readyToTriage : quanti;
    if (n === 0) return 'Con zero non valuta niente. Scrivi quanti annunci vuoi valutare.';
    if (n === 1) return 'Dà un voto al primo annuncio della lista e scrive la sua riga di CV.';
    return `Dà un voto a ${n} annunci e scrive la riga di CV per ognuno.`;
  },
  deep: (s) => {
    const n = quanti === null ? s.toAnalyse : Math.min(quanti, s.toAnalyse);
    if (s.toAnalyse === 0) return 'Nessun annuncio da leggere a fondo. Ci passano quelli con voto 3 o più.';
    if (n === 0) return 'Con zero non legge niente. Scrivi quanti annunci vuoi far leggere.';
    if (n === 1) return 'Legge un annuncio per intero: cosa chiede davvero, quanto ci sei vicino, cosa può dire la lettera.';
    return `Legge ${n} annunci per intero: cosa chiedono davvero, quanto ci sei vicino, cosa può dire la lettera.`;
  },
  packs: (s) => `Prepara CV e lettera per ${s.packsTodo} annunci.`,
  form: () => 'Apre il modulo già compilato in una finestra del browser, e si ferma lì.',
};

// I filtri pronti. Ogni voce elenca i modi in cui un annuncio può soddisfarla,
// separati da `|`: gli annunci sono per lo più in inglese ma non tutti, e
// "part time" e "tempo parziale" sono la stessa richiesta scritta in due
// lingue. Le voci spuntate nella stessa riga si sommano come alternative,
// quindi Part time + Full time vuol dire "uno dei due", non "nessuno".
const FILTRI = [
  { nome: 'Orario', voci: [
    { id: 'part', label: 'Part time', term: 'part time | tempo parziale' },
    { id: 'full', label: 'Full time', term: 'full time | tempo pieno' },
  ] },
  { nome: 'Dove', voci: [
    { id: 'remoto', label: 'Da remoto', term: 'remote | remoto | smart working | telelavoro' },
    { id: 'ibrido', label: 'Ibrido', term: 'hybrid | ibrido' },
    { id: 'milano', label: 'Milano', term: 'milan | milano' },
    { id: 'italia', label: 'Italia', term: 'ital' },
  ] },
  { nome: 'Contratto', voci: [
    { id: 'stage', label: 'Stage', term: 'internship | stage | tirocinio' },
    { id: 'appr', label: 'Apprendistato', term: 'apprenticeship | apprendistato' },
    { id: 'indet', label: 'Indeterminato', term: 'permanent | indeterminato' },
    { id: 'freelance', label: 'Freelance', term: 'freelance | contractor | partita iva' },
  ] },
  { nome: 'Livello', voci: [
    { id: 'junior', label: 'Junior', term: 'junior | entry level | graduate | neolaureat' },
    { id: 'noexp', label: 'Senza esperienza', term: 'no experience | no prior experience | nessuna esperienza | senza esperienza' },
  ] },
];

// Quanti annunci trattare al prossimo giro. null vuol dire "tutti quelli
// pronti": è il valore di partenza, non una scelta fatta.
let quanti = null;

// La ricerca web costa token, quindi si accende a mano a ogni giro.
let cercaWeb = false;

// Quali filtri sono spuntati. Sopravvive alla chiusura del browser: una
// ricerca impostata bene non si reimposta ogni volta.
let scelti = new Set();
try { scelti = new Set(JSON.parse(localStorage.getItem('career-ops-filtri') || '[]')); } catch { scelti = new Set(); }

let focus = '';
try { focus = localStorage.getItem('career-ops-focus') || ''; } catch { focus = ''; }

function ricorda() {
  try {
    localStorage.setItem('career-ops-filtri', JSON.stringify([...scelti]));
    localStorage.setItem('career-ops-focus', focus);
  } catch { /* sessione privata: pazienza */ }
}

// La richiesta completa: una riga di filtri spuntati diventa un gruppo di
// alternative, le parole scritte a mano si aggiungono come gruppi a sé.
function composeFocus() {
  const gruppi = FILTRI
    .map((f) => f.voci.filter((v) => scelti.has(v.id)).map((v) => v.term).join(' | '))
    .filter(Boolean);
  const libere = focus.split(',').map((t) => t.trim()).filter(Boolean);
  return [...gruppi, ...libere].join(', ');
}

// Come si dice a voce: le etichette dei filtri, non le loro alternative.
function focusLabels() {
  const dai = FILTRI.flatMap((f) => f.voci.filter((v) => scelti.has(v.id)).map((v) => v.label.toLowerCase()));
  return [...dai, ...focus.split(',').map((t) => t.trim()).filter(Boolean)];
}

function drawAct() {
  const id = selected || state.next || 'search';
  const phase = state.phases.find((p) => p.id === id);
  const stage = STAGES.find((p) => p.id === id);
  const s = state.stats;

  const disponibili = id === 'triage' ? s.readyToTriage : s.toAnalyse;
  // Su Cerca il campo non ha tetto: quanti annunci esistano là fuori non si sa
  // prima di cercarli. Sulle altre due il tetto è quello che c'è in coda.
  const qty = id === 'search'
    ? `<span class="qty"><label for="lim">Quanti</label>
       <input id="lim" type="number" min="1" value="${quanti === null ? 5 : quanti}"></span>`
    : (id === 'triage' || id === 'deep') && disponibili > 0
    ? `<span class="qty"><label for="lim">Quanti</label>
       <input id="lim" type="number" min="1" max="${Math.max(1, disponibili)}"
              value="${quanti === null ? Math.max(1, disponibili) : quanti}"></span>`
    : '';

  const foc = id === 'search'
    ? `<div class="filtri">
        ${FILTRI.map((f) => `
          <div class="frow" role="group" aria-label="${esc(f.nome)}">
            <span class="fname">${esc(f.nome)}</span>
            ${f.voci.map((v) => `<button class="chip" data-chip="${esc(v.id)}"
                aria-pressed="${scelti.has(v.id)}">${esc(v.label)}</button>`).join('')}
          </div>`).join('')}
        <div class="frow">
          <span class="fname">Parole</span>
          <span class="focus"><label class="sr" for="foc">altre parole da cercare</label>
            <input id="foc" type="text" value="${esc(focus)}"
                   placeholder="marketing, social — separale con la virgola"
                   autocomplete="off" spellcheck="false"></span>
        </div>
        <div class="frow" role="group" aria-label="Ricerca web">
          <span class="fname">Web</span>
          <button class="chip" data-web aria-pressed="${cercaWeb}">Cerca anche sul web</button>
        </div>
      </div>`
    : '';

  $('act').innerHTML = `
    <div class="act-head">
      <h2>${esc(stage ? stage.name : id)}</h2>
      <p id="act-say">${esc(SPIEGA[id](s))}</p>
    </div>
    <div class="act-bar">
      ${qty}
      <button class="primary" data-run="${esc(id)}">${esc(phase ? phase.label : id)}</button>
      ${foc}
    </div>`;

  const say = () => { $('act-say').textContent = SPIEGA[id](s); };

  const qEl = $('lim');
  if (qEl) {
    // Il campo arriva pieno. Chi ne vuole uno solo non deve prima cancellare
    // un numero a due cifre: al primo clic il valore è già selezionato.
    qEl.addEventListener('focus', () => qEl.select());
    qEl.addEventListener('mouseup', (e) => e.preventDefault());
    qEl.addEventListener('input', () => {
      quanti = qEl.value === '' ? null : Math.max(0, Number(qEl.value) || 0);
      say();
    });
    qEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') askConfirm(id); });
  }

  const fEl = $('foc');
  if (fEl) {
    fEl.addEventListener('input', () => { focus = fEl.value; ricorda(); say(); });
    fEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') askConfirm('search'); });
  }

  const wEl = document.querySelector('[data-web]');
  if (wEl) wEl.addEventListener('click', () => {
    cercaWeb = !cercaWeb;
    wEl.setAttribute('aria-pressed', String(cercaWeb));
  });

  document.querySelectorAll('[data-chip]').forEach((b) => {
    b.addEventListener('click', () => {
      const key = b.dataset.chip;
      if (scelti.has(key)) scelti.delete(key); else scelti.add(key);
      ricorda();
      b.setAttribute('aria-pressed', String(scelti.has(key)));
      say();
    });
  });

  $('restore').hidden = !state.canRestore;
  document.querySelectorAll('[data-run]').forEach((b) => {
    b.disabled = busy;
    b.addEventListener('click', () => askConfirm(b.dataset.run));
  });
}

// ---------------------------------------------------------------------------
// Il mio profilo
// ---------------------------------------------------------------------------

/**
 * Il profilo, una sezione alla volta.
 *
 * Nove sezioni aperte insieme erano un muro di testo in tre colonne: si vedeva
 * tutto e non si leggeva niente. Il riassunto sta in cima, sempre; il resto si
 * apre una scheda per volta. Viene dal disco, non da un modello: riassumerlo
 * costerebbe token e, peggio, farebbe deriva proprio nella sezione dei
 * divieti, dove "non programmo" non può ammorbidirsi in "profilo tecnico".
 */
let profilo = null;

async function apriProfilo() {
  const box = $('io-in');
  if (!profilo) {
    const { body, status } = await api('/api/profile');
    if (status !== 200) { box.innerHTML = `<p class="io-lead">${esc(body.error || 'Profilo non disponibile.')}</p>`; return; }
    profilo = body;
  }

  // Il grassetto di markdown è l'unica formattazione che passa: serve a marcare
  // una parola dentro una riga, non ad aprire una porta all'HTML arbitrario.
  const forte = (t) => esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const sezioni = profilo.sections || [];
  // "Chi sono" è il riassunto: sta in cima e non si chiude.
  const lead = sezioni.find((s) => s.prose && !s.points.length) || null;
  const schede = sezioni.filter((s) => s !== lead);

  box.innerHTML = `
    ${lead ? `<p class="io-lead">${forte(lead.prose)}</p>` : ''}
    <div class="io-grid">
      <div class="io-tabs" role="tablist" aria-label="Sezioni del profilo">
        ${schede.map((s, i) => `
          <button class="io-tab" role="tab" id="iotab-${i}" data-tab="${i}"
                  aria-controls="iopan-${i}" aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">
            ${esc(s.title)}<span class="n">${s.points.length || ''}</span>
          </button>`).join('')}
      </div>
      <div class="io-panes">
        ${schede.map((s, i) => `
          <div class="io-panel" role="tabpanel" id="iopan-${i}" aria-labelledby="iotab-${i}"
               data-guard="${/non posso|non puoi|manca/i.test(s.title) ? 'yes' : 'no'}" ${i === 0 ? '' : 'hidden'}>
            <h3>${esc(s.title)}</h3>
            ${s.prose ? `<p>${forte(s.prose)}</p>` : ''}
            ${s.points.length ? `<ul>${s.points.map((p) => `<li>${forte(p)}</li>`).join('')}</ul>` : ''}
          </div>`).join('')}
      </div>
    </div>`;

  const tabs = [...box.querySelectorAll('[data-tab]')];
  const mostra = (i) => {
    tabs.forEach((t, j) => {
      t.setAttribute('aria-selected', String(i === j));
      t.tabIndex = i === j ? 0 : -1;
      $(`iopan-${j}`).hidden = i !== j;
    });
  };
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => mostra(i));
    t.addEventListener('keydown', (e) => {
      const d = e.key === 'ArrowDown' || e.key === 'ArrowRight' ? 1 : e.key === 'ArrowUp' || e.key === 'ArrowLeft' ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      const next = (i + d + tabs.length) % tabs.length;
      mostra(next);
      tabs[next].focus();
    });
  });
}

$('io-toggle').addEventListener('click', () => {
  const t = $('io-toggle');
  const open = t.getAttribute('aria-expanded') !== 'true';
  t.setAttribute('aria-expanded', String(open));
  $('io').dataset.open = open ? 'yes' : 'no';
  if (open) apriProfilo();
});

// ---------------------------------------------------------------------------
// Conferma
// ---------------------------------------------------------------------------

function limitValue() {
  const el = $('lim');
  return el ? Math.max(0, Number(el.value) || 0) : undefined;
}

async function askConfirm(phaseId, slug) {
  const limit = phaseId === 'search' || phaseId === 'triage' || phaseId === 'deep' ? limitValue() : undefined;
  const foc = phaseId === 'search' ? composeFocus() : undefined;
  const web = phaseId === 'search' && cercaWeb;
  const { body } = await api('/api/preflight', { phase: phaseId, limit, focus: foc, web });
  pending = { phase: phaseId, limit, focus: foc, slug, web };
  if (slug) body.affects = `solo ${slug}`;
  drawConfirm(body);
}

function drawConfirm(p) {
  $('fail').innerHTML = '';
  $('confirm').innerHTML = `
    <section class="panel" role="alertdialog" aria-labelledby="ct">
      <span class="kicker">Conferma prima di procedere</span>
      <h3 id="ct">${esc(p.label)}</h3>
      <p>${esc(p.blurb)}</p>
      <dl class="facts">
        <div class="fact"><dt>Su cosa agisce</dt><dd>${esc(p.affects)}</dd></div>
        <div class="fact"><dt>File che tocca</dt><dd>${(p.writes || []).map((w) => `<code>${esc(w)}</code>`).join(' ')}</dd></div>
        <div class="fact"><dt>Costo</dt><dd>${esc(p.cost || '—')}${p.model ? ` · modello <b>${esc(p.model)}</b>` : ''}</dd></div>
        <div class="fact"><dt>Rischio</dt><dd>${esc(RISK[p.risk] || p.risk || '—')}</dd></div>
        <div class="fact"><dt>Si torna indietro</dt><dd>${p.reversible === false ? 'No' : esc(p.rollback || 'Sì')}</dd></div>
      </dl>
      ${p.warning ? `<div class="warn"><b>Attenzione.</b> ${esc(p.warning)}</div>` : ''}
      <div class="panel-actions">
        <button class="primary" id="go">Procedi</button>
        <button class="quiet" id="no">Annulla</button>
      </div>
    </section>`;
  $('go').addEventListener('click', go);
  $('no').addEventListener('click', () => { pending = null; $('confirm').innerHTML = ''; });
  $('go').focus();
}

// ---------------------------------------------------------------------------
// Esecuzione
// ---------------------------------------------------------------------------

async function go() {
  if (!pending) return;
  const req = pending;
  pending = null;
  $('confirm').innerHTML = '';
  busy = true;
  drawAct();

  if (req.phase === 'restore') {
    await api('/api/restore', { confirm: true });
    busy = false;
    return refresh();
  }

  const { body, status } = await api('/api/run', { phase: req.phase, limit: req.limit, focus: req.focus, slug: req.slug, web: req.web, confirm: true });
  if (!body.runId) {
    if (status >= 400) drawNote(body.error || 'La fase non è partita.');
    busy = false;
    return refresh();
  }
  watch(body.runId);
}

function watch(runId) {
  clearInterval(poll);
  poll = setInterval(async () => {
    const { body } = await api(`/api/run/${runId}`);
    drawRun(body);
    if (body.status === 'running') return;
    clearInterval(poll);
    busy = false;
    if (body.status === 'error') drawFail(body.error);
    refresh();
  }, 700);
}

function drawRun(run) {
  const phase = state.phases.find((p) => p.id === run.phase);
  const lines = run.lines || [];
  const live = run.status === 'running';
  const word = live ? 'in corso' : run.status === 'done' ? 'finito' : 'fermato';
  $('run').innerHTML = `
    <section class="run" data-live="${live ? 'yes' : 'no'}">
      <div class="run-head">
        <span class="beat" aria-hidden="true"></span>
        <span>${esc(phase ? phase.label : run.phase)} · ${word}</span>
      </div>
      <div class="run-log" id="rlog">${lines.map((l, i) =>
        `<span class="${i === lines.length - 1 && live ? 'cur' : ''}">${esc(l)}</span>`
      ).join('\n')}</div>
    </section>`;
  const log = $('rlog');
  if (log) log.scrollTop = log.scrollHeight;
}

/** Un avviso breve, per quello che non merita il blocco d'errore intero. */
function drawNote(text) {
  $('fail').innerHTML = `<section class="panel" role="status"><p>${esc(text)}</p></section>`;
}

function drawFail(e) {
  if (!e) return;
  $('fail').innerHTML = `
    <section class="panel fail" role="alert">
      <div class="tags">
        <span class="tag">Si è fermato</span>
        <span class="tag open">${e.blocking ? 'blocca il resto' : 'non blocca il resto'}</span>
        <span class="tag open">${esc(e.phaseLabel)}${e.step ? ` · ${esc(e.step)}` : ''}</span>
      </div>
      <h3>${esc(e.explain)}</h3>
      <p>${esc(e.message)}</p>
      <dl class="facts">
        <div class="fact"><dt>File coinvolti</dt><dd>${(e.files || []).map((f) => `<code>${esc(f)}</code>`).join(' ') || '—'}</dd></div>
        <div class="fact"><dt>Cosa conviene fare</dt><dd>${esc(e.hint)}</dd></div>
      </dl>
      <div class="panel-actions">
        ${(e.actions || []).includes('riprova') ? '<button class="primary" data-fix="riprova">Riprova</button>' : ''}
        ${(e.actions || []).includes('ripristina') ? '<button data-fix="ripristina">Ripristina</button>' : ''}
        <button class="quiet" data-fix="chiudi">Chiudi</button>
      </div>
      <details class="raw"><summary>Log completo</summary><pre>${esc(e.output || '')}</pre></details>
    </section>`;

  document.querySelectorAll('[data-fix]').forEach((b) => b.addEventListener('click', () => {
    const what = b.dataset.fix;
    $('fail').innerHTML = '';
    if (what === 'riprova') askConfirm(e.phase);
    if (what === 'ripristina') askRestore();
  }));
}

async function askRestore() {
  const { body } = await api('/api/restore', {});
  pending = { phase: 'restore' };
  drawConfirm(body);
}

// ---------------------------------------------------------------------------
// Gli annunci
// ---------------------------------------------------------------------------

// L'ordine è quello dell'attenzione: prima ciò che aspetta te.
const GROUPS = [
  { key: 'decide',  title: 'Da decidere' },
  { key: 'chosen',  title: 'Scelti' },
  { key: 'waiting', title: 'Non valutati' },
  { key: 'skipped', title: 'Ignorati' },
];

function bucket(r) {
  if (r.apply === 'submitted' || r.apply === 'chosen' || r.apply === 'partial') return 'chosen';
  if (r.apply === 'skipped' || r.apply === 'dead') return 'skipped';
  if (r.score === '' || r.score === null) return 'waiting';
  return 'decide';
}

function drawList() {
  // La schermata Cerca serve a cercare. Gli annunci con i loro bottoni sono
  // decisioni, e una decisione si prende dopo aver letto un punteggio: vivono
  // da Valuta in poi.
  if ((selected || state.next || 'search') === 'search') return drawSearchList();

  if (!state.rows.length) return drawBlank();

  const by = { decide: [], chosen: [], waiting: [], skipped: [] };
  state.rows.forEach((r) => by[bucket(r)].push(r));

  $('list').innerHTML = GROUPS.filter((g) => by[g.key].length).map((g) => {
    const head = `<div class="group-head"><h2>${esc(g.title)}</h2><span class="n">${by[g.key].length}</span>${
      g.key === 'skipped' ? '<span class="link"><span class="chiuso">mostra</span><span class="aperto">nascondi</span> <i class="caret" aria-hidden="true"></i></span>' : ''
    }</div>`;
    const body = by[g.key].map(rowHtml).join('');
    return g.key === 'skipped'
      ? `<details class="group"><summary>${head}</summary>${body}</details>`
      : `<section class="group">${head}${body}</section>`;
  }).join('');

  wireRows();
}

function wireRows() {
  document.querySelectorAll('[data-decide]').forEach((b) => b.addEventListener('click', async () => {
    b.disabled = true;
    const { body, status } = await api('/api/decide', { slug: b.dataset.slug, decision: b.dataset.decide });
    if (status !== 200) drawNote(body.error || 'La decisione non è stata registrata.');
    else if (body.tracker && body.tracker.error) drawNote(`Segnata come inviata, ma il tracker non è stato aggiornato: ${body.tracker.error}`);
    else if (body.tracker && body.tracker.num) drawNote(`Registrata nel tracker come #${body.tracker.num}.`);
    refresh();
  }));

  // Apri il form su QUESTO annuncio, non sul primo che capita.
  document.querySelectorAll('[data-form]').forEach((b) => b.addEventListener('click', () => {
    askConfirm('form', b.dataset.form);
  }));

  document.querySelectorAll('[data-more]').forEach((d) => d.addEventListener('toggle', () => {
    if (d.open) apriDettagli(d);
  }));
}

/**
 * I bottoni di decisione compaiono solo quando c'è un voto.
 *
 * Prima comparivano su ogni riga: ventuno annunci senza voto significavano
 * ottantaquattro bottoni che chiedevano di decidere senza l'unica informazione
 * che serve per decidere. Quel lavoro è esattamente ciò che la fase Valuta
 * esiste per toglierti.
 */
function azioni(r) {
  const scored = r.score !== '' && r.score !== null;

  if (r.apply === 'skipped') return `<button data-decide="apply" data-slug="${esc(r.slug)}">Rimetti in gioco</button>`;
  // Inviata o chiusa: nessun bottone. Non si torna indietro con un click.
  if (r.apply === 'submitted' || r.apply === 'dead') return '';
  if (!scored) return '';

  // Form aperto: l'unica domanda che resta è se l'hai mandata.
  if (r.apply === 'opened') {
    return `
      <button class="primary" data-decide="sent" data-slug="${esc(r.slug)}">Ho inviato</button>
      <button class="quiet" data-decide="skip" data-slug="${esc(r.slug)}">Non inviata</button>`;
  }
  const canOpen = r.apply === 'chosen' && (r.pack === 'built' || r.pack === 'jd_failed');

  return `
    <button class="primary" data-decide="apply" data-slug="${esc(r.slug)}" aria-pressed="${r.apply === 'chosen'}">Candidati</button>
    ${canOpen ? `<button data-form="${esc(r.slug)}">Apri il form</button>` : ''}
    <button class="quiet" data-decide="partial" data-slug="${esc(r.slug)}" aria-pressed="${r.apply === 'partial'}">Solo documenti</button>
    <button class="quiet" data-decide="skip" data-slug="${esc(r.slug)}" aria-pressed="${r.apply === 'skipped'}">Ignora</button>
    ${r.apply === 'chosen' || r.apply === 'partial' ? `<button class="quiet" data-decide="sent" data-slug="${esc(r.slug)}">Ho inviato</button>` : ''}`;
}

// Quando l'annuncio è stato letto per intero, il voto da 1 a 5 lascia il posto
// al suo risultato: due numeri sulla stessa riga sarebbero due verdetti, e chi
// legge non saprebbe a quale credere. Il voto resta nel suggerimento.
function verdetto(r) {
  if (!r.fit) {
    const none = r.score === '' || r.score === null;
    return `<div class="score" data-none="${none ? 'yes' : 'no'}">${none ? '—' : esc(Number(r.score).toFixed(1))}</div>`;
  }
  const voto = r.score === '' ? '' : ` · voto ${Number(r.score).toFixed(1)}`;
  if (r.fit.blocked) {
    return `<div class="score" data-none="no" data-kind="blocked" title="Requisito bloccante non soddisfatto${esc(voto)}">no</div>`;
  }
  return `<div class="score" data-none="no" data-kind="fit" title="${r.fit.total} requisiti letti${esc(voto)}">${r.fit.percent}%</div>`;
}

const SEGNO = {
  soddisfatto:       { mark: '●', parola: 'sì' },
  parziale:          { mark: '◐', parola: 'in parte' },
  'non soddisfatto': { mark: '○', parola: 'no' },
};

/** Cosa c'è da sapere in più: una riga, e la tendina la dice. */
function apertura(r) {
  if (r.fit && !r.fit.blocked) return `Perché ${r.fit.percent}% e cosa chiede`;
  if (r.fit && r.fit.blocked) return `Non raggiungibile: ${r.fit.blockers[0] || 'requisito bloccante'}`;
  return 'Dettagli';
}

function rowHtml(r) {
  const parola = STATE_WORD[r.apply];
  const luogo = dove(r.location);
  return `
  <article class="row">
    ${verdetto(r)}
    <div class="who">
      <h3>${esc(r.role || 'Ruolo non indicato')}</h3>
      <div class="meta">
        <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.company || 'Azienda ignota')}</a>
        ${luogo ? `<span class="sep">·</span><span title="${esc(r.location)}">${esc(luogo)}</span>` : ''}
        ${parola ? `<span class="sep">·</span><span class="state" data-k="${esc(r.apply)}">${esc(parola)}</span>` : ''}
      </div>
      ${r.teaser ? `<p class="teaser">${esc(r.teaser)}</p>` : ''}
    </div>
    <div class="pick">${azioni(r)}</div>
    <details class="more" data-more="${esc(r.slug)}" data-fit="${r.fit ? 'yes' : 'no'}">
      <summary>${esc(apertura(r))} <i class="caret" aria-hidden="true"></i></summary>
      <div class="more-body">carico…</div>
    </details>
  </article>`;
}

/**
 * La tendina di una riga, riempita quando la apri.
 *
 * Venti analisi spedite insieme alla plancia sarebbero un carico che nessuno
 * legge; una richiesta a richiesta sono gli stessi dati nel momento in cui li
 * vuoi. Quello che non richiede il disco — sede per esteso, riga di CV, link —
 * si disegna subito.
 */
async function apriDettagli(det) {
  const box = det.querySelector('.more-body');
  if (det.dataset.caricata === 'yes') return;
  det.dataset.caricata = 'yes';

  const r = state.rows.find((x) => x.slug === det.dataset.more);
  if (!r) { box.textContent = 'Questa riga non è più in coda.'; return; }
  const base = `
    <dl class="pairs">
      ${r.location ? `<div class="pair"><dt>Sede</dt><dd>${esc(r.location)}</dd></div>` : ''}
      ${r.level ? `<div class="pair"><dt>Livello</dt><dd>${esc(r.level)}</dd></div>` : ''}
      ${r.summary_line && r.summary_line !== 'n/a' ? `<div class="pair"><dt>Riga di CV</dt><dd>${esc(r.summary_line)}</dd></div>` : ''}
      ${!r.jd ? '<div class="pair"><dt>Testo</dt><dd>l\'annuncio non si è lasciato scaricare</dd></div>' : ''}
      <div class="pair"><dt>Annuncio</dt><dd><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a></dd></div>
    </dl>`;

  if (det.dataset.fit !== 'yes') { box.innerHTML = base; return; }

  const { body, status } = await api(`/api/analysis/${encodeURIComponent(det.dataset.more)}`);
  if (status !== 200) { box.innerHTML = `${base}<p class="nota">Questa analisi non si trova più sul disco.</p>`; return; }

  const reqs = (body.requisiti || []).map((q) => {
    const seg = SEGNO[q.stato] || { mark: '·', parola: q.stato };
    return `<div class="req">
      <div class="mark" aria-hidden="true">${seg.mark}</div>
      <div>
        <q>${esc(q.testo)}</q>
        <p class="nota"><b>${esc(seg.parola)}</b>${q.bloccante ? ' · bloccante' : ''}${q.perche ? ` — ${esc(q.perche)}` : ''}</p>
      </div>
    </div>`;
  }).join('');

  const ag = (body.agganci || []).length
    ? `<div class="agganci"><h4>Cosa può dire la lettera</h4><ul>${
        body.agganci.map((a) => `<li>${esc(a.punto)} <span>← ${esc(a.fatto)}</span></li>`).join('')
      }</ul></div>`
    : `<div class="agganci"><h4>Cosa può dire la lettera</h4>
       <p class="nota">Niente che regga su un fatto vero. La lettera qui non ha appigli.</p></div>`;

  box.innerHTML = `${body.sintesi ? `<p class="sintesi">${esc(body.sintesi)}</p>` : ''}${base}${reqs}${ag}`;
}

/**
 * La schermata Cerca: quanto c'è in casa, e dove va a guardare.
 *
 * L'elenco dei portali arriva da portals.yml, non è scritto qui: una lista a
 * mano mentirebbe il primo giorno che una bacheca viene disabilitata. Sta
 * chiuso, perché è configurazione e non il lavoro del giorno.
 */
let fonti = null;

async function drawSearchList() {
  const s = state.stats;

  if (!fonti) {
    const { body, status } = await api('/api/sources');
    fonti = status === 200 ? body : { error: body.error || 'portals.yml non si legge' };
  }

  const dentro = s.total === 0
    ? 'In coda non c\'è ancora niente.'
    : `In coda ci sono ${s.total} annunci, ${s.readyToTriage} ancora da valutare.`;

  const elenco = fonti.error
    ? `<p class="say">${esc(fonti.error)}</p>`
    : fonti.portals.map((p) => `
        <div class="fonte">
          <span class="fonte-nome">${esc(p.id)}${p.examples.length
            ? ` <span class="fonte-esempi">${esc(p.examples.join(', '))}${p.entries > p.examples.length ? '…' : ''}</span>` : ''}</span>
          <span class="fonte-n">${p.entries === 1 ? '1 bacheca' : `${p.entries} bacheche`}</span>
        </div>`).join('');

  // Il numero che conta è quello delle bacheche interrogate: "12" erano le
  // famiglie di portale, e nessuno pensa alla ricerca in quei termini.
  const quanti_ = fonti.error ? '' : `<span class="n">${fonti.counts.total} bacheche</span>`;

  $('list').innerHTML = `
    <section class="group">
      <div class="group-head"><h2>In casa</h2></div>
      <p class="say">${esc(dentro)}</p>
    </section>
    <details class="group">
      <summary>
        <div class="group-head"><h2>Dove cerca</h2>${quanti_}
          <span class="link"><span class="chiuso">mostra</span><span class="aperto">nascondi</span> <i class="caret" aria-hidden="true"></i></span>
        </div>
      </summary>
      ${elenco}
    </details>`;
}

function drawBlank() {
  $('list').innerHTML = `
    <div class="blank">
      <h2>Ancora niente in coda</h2>
      <p>Cinque fasi in fila. Ognuna dice cosa farà prima di partire, e si può tornare indietro.</p>
      <ol>
        <li><b>Cerca</b> interroga i portali e scarica il testo degli annunci.</li>
        <li><b>Valuta</b> dà un punteggio a ciascuno e scrive la riga da mettere in cima al CV.</li>
        <li><b>Analizza</b> rilegge per intero quelli passati e dice cosa chiedono davvero.</li>
        <li><b>Documenti</b> genera CV e lettera per quelli sopra soglia.</li>
        <li><b>Compila</b> apre il form riempito.</li>
      </ol>
    </div>`;
}

function drawSkeleton() {
  $('list').innerHTML = `<section class="group">${
    '<div class="skel"><i></i><div><i></i><i></i></div></div>'.repeat(4)
  }</section>`;
}

// ---------------------------------------------------------------------------

/** Prima di iniziare: cosa manca a un'installazione nuova, e come si mette. */
async function drawSetup() {
  const { body } = await api('/api/doctor');
  const box = $('setup');
  if (!body || body.ready) { box.innerHTML = ''; return; }
  box.innerHTML = `
    <section class="panel">
      <span class="kicker">Prima di iniziare</span>
      <h3>Mancano dei file</h3>
      <p>Caronte non può partire finché non ci sono. Dal terminale, nella cartella del progetto:</p>
      <dl class="facts">
        ${body.missing.map((m) => `<div class="fact"><dt>${esc(m.path)}</dt>
          <dd>${esc(m.what)}<br><code>${esc(m.how)}</code></dd></div>`).join('')}
      </dl>
      <p>Poi ricarica la pagina.</p>
    </section>`;
}

async function refresh() {
  drawSetup();
  const { body } = await api('/api/state');
  state = body;
  if (!selected) selected = state.next || 'search';
  drawTrack();
  drawAct();
  drawList();
}

$('restore').addEventListener('click', askRestore);
drawSkeleton();
refresh();
</script>
</body>
