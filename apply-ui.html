<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>career-ops — pannello candidature</title>
<style>
/* --------------------------------------------------------------------------
   Tokens

   Carta calda, non bianco. Si usa di giorno alla scrivania: il bianco puro
   alla finestra stanca, il nero puro non esiste in natura. Tutti i neutri
   sono virati sulla stessa tinta calda (hue 75) del colore d'azione.

   Un solo accento, mattone bruciato, e solo per tre cose: l'azione
   principale, la fase corrente, l'anello di focus. Mai decorazione.
   Il blocco d'errore non usa un secondo colore: usa l'inchiostro pieno e le
   parole, perché lo stato deve leggersi anche senza distinguere i colori.
   -------------------------------------------------------------------------- */
:root {
  --paper:        oklch(0.978 0.006 85);
  --paper-sunk:   oklch(0.955 0.008 85);
  --paper-raised: oklch(0.993 0.004 85);
  --rule:         oklch(0.885 0.008 82);
  --rule-strong:  oklch(0.800 0.010 80);
  --ink:          oklch(0.255 0.014 75);
  --ink-soft:     oklch(0.455 0.012 75);
  --ink-faint:    oklch(0.605 0.010 78);
  --accent:       oklch(0.510 0.140 40);
  --accent-press: oklch(0.440 0.140 40);
  --accent-wash:  oklch(0.945 0.030 55);

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;

  /* Scala fissa, rapporto ~1.2. Niente clamp: la densità è voluta. */
  --t-xs:   0.75rem;
  --t-sm:   0.8125rem;
  --t-base: 0.9375rem;
  --t-md:   1.0625rem;
  --t-lg:   1.3125rem;
  --t-xl:   1.75rem;

  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 160ms;
}

*, *::before, *::after { box-sizing: border-box; }

html { color-scheme: light; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: var(--t-base)/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}

.wrap { max-width: 78rem; margin: 0 auto; padding: 0 1.5rem; }

/* --------------------------------------------------------------------------
   Plancia — non si chiude mai
   -------------------------------------------------------------------------- */
.board {
  position: sticky; top: 0; z-index: 10;
  background: var(--paper);
  border-bottom: 1px solid var(--rule-strong);
}

.board-head {
  display: flex; align-items: baseline; gap: 0.875rem;
  padding: 1.125rem 0 0.875rem;
}
.board-head h1 {
  margin: 0;
  font-size: var(--t-md);
  font-weight: 640;
  letter-spacing: -0.011em;
}
.board-head .sub {
  font-size: var(--t-sm);
  color: var(--ink-faint);
}
.board-head .spacer { flex: 1; }

/* Rotaia delle fasi. La posizione porta il significato, il colore lo conferma. */
.rail {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
  border-bottom: none;
  border-radius: 4px 4px 0 0;
  overflow: hidden;
}

/* La casella è un bottone: azzero l'aspetto nativo e tengo il disegno. */
.stage {
  appearance: none;
  font: inherit; color: inherit; text-align: left;
  border: none; border-radius: 0;
  background: var(--paper-raised);
  padding: 0.75rem 0.875rem 0.8125rem;
  display: flex; flex-direction: column; gap: 0.1875rem;
  min-width: 0; cursor: pointer;
  transition: background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.stage:hover { background: var(--paper-sunk); }
.stage[data-current="yes"] { background: var(--accent-wash); }
.stage[data-current="yes"]:hover { background: oklch(0.925 0.038 55); }
/* Quale casella comanda la barra qui sotto: una barra piena in alto, non solo
   una sfumatura, perché lo stato non può dipendere dal colore. */
.stage[aria-pressed="true"] { box-shadow: inset 0 3px 0 0 var(--ink); }
.stage[aria-pressed="true"][data-current="yes"] { box-shadow: inset 0 3px 0 0 var(--accent); }
.stage:focus-visible { outline-offset: -3px; }

.stage-top { display: flex; align-items: baseline; gap: 0.5rem; }
.stage-idx {
  font: 600 var(--t-xs)/1 var(--mono);
  color: var(--ink-faint);
  letter-spacing: 0.04em;
}
.stage[data-current="yes"] .stage-idx { color: var(--accent); }
.stage-name {
  font-size: var(--t-sm); font-weight: 580;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stage-count {
  font: 400 var(--t-xs)/1.4 var(--mono);
  color: var(--ink-soft);
}
/* "Prossimo" è scritto, non solo colorato. */
.stage-flag {
  font-size: var(--t-xs); font-weight: 620;
  text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--accent);
}

/* --------------------------------------------------------------------------
   Barra azione
   -------------------------------------------------------------------------- */
.act {
  display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
  padding: 0.875rem 1rem;
  background: var(--paper-sunk);
  border: 1px solid var(--rule);
  border-radius: 0 0 4px 4px;
  margin-bottom: 2.25rem;
}
.act-say { font-size: var(--t-sm); color: var(--ink-soft); margin-right: auto; }
.act-say b { color: var(--ink); font-weight: 600; }

button {
  font: 550 var(--t-sm)/1 var(--sans);
  padding: 0.5625rem 0.9375rem;
  border: 1px solid var(--rule-strong);
  border-radius: 4px;
  background: var(--paper-raised);
  color: var(--ink);
  cursor: pointer;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
button:hover:not(:disabled) { background: var(--paper-sunk); border-color: var(--ink-faint); }
button:active:not(:disabled) { background: var(--rule); }
button:disabled { color: var(--ink-faint); border-color: var(--rule); cursor: not-allowed; }

button.primary {
  background: var(--accent); border-color: var(--accent); color: var(--paper);
}
button.primary:hover:not(:disabled) { background: var(--accent-press); border-color: var(--accent-press); }
button.primary:active:not(:disabled) { background: var(--accent-press); }
button.primary:disabled { background: var(--rule); border-color: var(--rule); color: var(--ink-faint); }

button.quiet { border-color: transparent; background: transparent; color: var(--ink-soft); padding-inline: 0.5rem; }
button.quiet:hover:not(:disabled) { background: var(--paper-sunk); color: var(--ink); }

/* Stato "sta girando": il bottone lo dice a parole, non solo con uno spinner. */
button[data-busy="yes"] { color: var(--ink-faint); }

.qty { display: flex; align-items: center; gap: 0.4375rem; font-size: var(--t-sm); color: var(--ink-soft); }

/* I filtri prendono tutta la larghezza sotto il bottone: una riga per
   domanda, l'etichetta a sinistra sempre nella stessa colonna, così le
   risposte si leggono incolonnate invece che a zig-zag. */
/* Visibile solo a chi legge con uno screen reader: il campo ha un'etichetta
   vera anche dove sullo schermo basta il testo dentro. */
.sr {
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}

.filtri { flex: 1 0 100%; display: grid; gap: 0.375rem; margin-top: 0.125rem; }
.frow { display: flex; align-items: center; gap: 0.4375rem; flex-wrap: wrap; }
.fname {
  flex: 0 0 5.5rem;
  font: 500 var(--t-xs)/1 var(--sans);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.chip {
  font: 500 var(--t-xs)/1 var(--sans);
  padding: 0.375rem 0.625rem;
  border-radius: 999px;
}
/* Scelto si vede dal pieno, non dalla tinta: chi non distingue i colori
   legge lo stesso quali filtri sono attivi. */
.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}
.chip[aria-pressed="true"]:hover { background: var(--ink); color: var(--paper); }

.focus { display: flex; align-items: center; gap: 0.4375rem; flex: 1; min-width: 14rem; }
.focus label { font-size: var(--t-sm); color: var(--ink-soft); }
.focus input {
  flex: 1;
  min-width: 0;
  font: 400 var(--t-sm)/1.3 var(--sans);
  padding: 0.5rem 0.625rem;
  border: 1px solid var(--rule-strong);
  border-radius: 4px;
  background: var(--paper-raised);
  color: var(--ink);
}
.focus input::placeholder { color: var(--ink-faint, var(--ink-soft)); opacity: 0.7; }
.qty input {
  width: 4.25rem;
  font: 500 var(--t-sm)/1 var(--mono);
  padding: 0.5rem 0.5rem;
  border: 1px solid var(--rule-strong);
  border-radius: 4px;
  background: var(--paper-raised);
  color: var(--ink);
}

/* --------------------------------------------------------------------------
   Conferma — in linea, non in una finestra modale
   -------------------------------------------------------------------------- */
.confirm {
  border: 1px solid var(--ink);
  border-radius: 4px;
  margin-bottom: 2.25rem;
  background: var(--paper-raised);
  overflow: hidden;
}
.confirm-head {
  background: var(--ink); color: var(--paper);
  padding: 0.5625rem 1rem;
  font-size: var(--t-xs); font-weight: 640;
  text-transform: uppercase; letter-spacing: 0.09em;
}
.confirm-body { padding: 1.125rem 1rem 1rem; }
.confirm-body h3 { margin: 0 0 0.375rem; font-size: var(--t-md); font-weight: 620; }
.confirm-body p { margin: 0 0 1rem; max-width: 68ch; color: var(--ink-soft); }

.facts { border-top: 1px solid var(--rule); margin-bottom: 1.125rem; }
.fact {
  display: flex; gap: 1rem; align-items: baseline;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--rule);
  font-size: var(--t-sm);
}
.fact dt {
  flex: 0 0 11rem; margin: 0;
  color: var(--ink-faint);
  text-transform: uppercase; font-size: var(--t-xs);
  letter-spacing: 0.06em; font-weight: 600;
}
.fact dd { margin: 0; min-width: 0; }
.fact dd code { font: 400 var(--t-xs)/1.7 var(--mono); background: var(--paper-sunk); padding: 0.0625rem 0.3125rem; border-radius: 3px; }

.warn {
  font-size: var(--t-sm);
  padding: 0.625rem 0.8125rem;
  border: 1px solid var(--rule-strong);
  background: var(--paper-sunk);
  border-radius: 4px;
  margin-bottom: 1.125rem;
}
.warn b { font-weight: 640; }

.confirm-actions { display: flex; gap: 0.625rem; align-items: center; }

/* --------------------------------------------------------------------------
   Console
   -------------------------------------------------------------------------- */
.console { margin-bottom: 2.25rem; }
.console-head {
  display: flex; align-items: baseline; gap: 0.625rem;
  font-size: var(--t-xs); font-weight: 620;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-faint);
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 0.625rem;
}
.console-log {
  font: 400 var(--t-xs)/1.65 var(--mono);
  color: var(--ink-soft);
  max-height: 13rem; overflow-y: auto;
  white-space: pre-wrap; word-break: break-word;
  padding-right: 0.5rem;
}
.console-log .cur { color: var(--ink); font-weight: 500; }

/* --------------------------------------------------------------------------
   Errore — inchiostro pieno e parole. Niente secondo colore.
   -------------------------------------------------------------------------- */
.fail { border: 2px solid var(--ink); border-radius: 4px; margin-bottom: 2.25rem; overflow: hidden; }
.fail-head {
  background: var(--ink); color: var(--paper);
  padding: 0.625rem 1rem;
  display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap;
  font-size: var(--t-xs); font-weight: 640;
  text-transform: uppercase; letter-spacing: 0.09em;
}
.fail-head .tag {
  border: 1px solid currentColor; border-radius: 2px;
  padding: 0.0625rem 0.375rem;
  letter-spacing: 0.06em;
}
.fail-body { padding: 1.125rem 1rem 1rem; background: var(--paper-raised); }
.fail-body h3 { margin: 0 0 0.5rem; font-size: var(--t-md); font-weight: 620; max-width: 68ch; }
.fail-body .say { margin: 0 0 1.125rem; max-width: 68ch; }
.fail-body .hint { margin: 0 0 1.125rem; max-width: 68ch; color: var(--ink-soft); }
.fail-body .hint b { color: var(--ink); font-weight: 620; }

details.raw { margin-top: 1.125rem; border-top: 1px solid var(--rule); padding-top: 0.75rem; }
details.raw summary {
  cursor: pointer; font-size: var(--t-xs); font-weight: 620;
  text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint);
}
details.raw summary:hover { color: var(--ink); }
details.raw pre {
  font: 400 var(--t-xs)/1.6 var(--mono);
  background: var(--paper-sunk); color: var(--ink-soft);
  padding: 0.75rem; border-radius: 4px;
  max-height: 17rem; overflow: auto;
  margin: 0.75rem 0 0; white-space: pre-wrap; word-break: break-word;
}

/* --------------------------------------------------------------------------
   Elenco ruoli — righe su una rotaia, non riquadri
   -------------------------------------------------------------------------- */
.group { margin-bottom: 2.75rem; }
details.group > summary { cursor: pointer; list-style: none; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary .group-head { border-bottom-color: var(--rule); }
details.group > summary .group-head::after {
  content: "mostra"; margin-left: auto;
  font-size: var(--t-xs); font-weight: 600; color: var(--ink-faint);
  text-transform: uppercase; letter-spacing: 0.07em;
}
details.group[open] > summary .group-head::after { content: "nascondi"; }
details.group > summary:hover .group-head::after { color: var(--ink); }
.group-head {
  display: flex; align-items: baseline; gap: 0.625rem;
  padding-bottom: 0.5rem; margin-bottom: 0;
  border-bottom: 1px solid var(--rule-strong);
}
.group-head h2 {
  margin: 0; font-size: var(--t-sm); font-weight: 640;
  text-transform: uppercase; letter-spacing: 0.08em;
}
.group-head .n { font: 400 var(--t-xs)/1 var(--mono); color: var(--ink-faint); }

.row {
  display: grid;
  grid-template-columns: 2.5rem minmax(0, 1fr) auto;
  gap: 0 1rem;
  align-items: start;
  padding: 0.9375rem 0.5rem 0.9375rem 0;
  border-bottom: 1px solid var(--rule);
  transition: background var(--dur) var(--ease);
}
.row:hover { background: var(--paper-raised); }

.score {
  font: 600 var(--t-md)/1.25 var(--mono);
  text-align: right;
  padding-top: 0.0625rem;
  font-variant-numeric: tabular-nums;
}
.score[data-none="yes"] { color: var(--ink-faint); font-weight: 400; font-size: var(--t-sm); }
/* Una percentuale ha due cifre e un simbolo: al corpo del voto sborderebbe. */
.score[data-kind="fit"] { font-size: var(--t-sm); }
.score[data-kind="blocked"] { font-size: var(--t-sm); font-weight: 400; color: var(--ink-soft); }

/* Il verdetto della lettura approfondita. Sta sotto la riga, chiuso, e si
   apre solo se lo chiedi: aperto su venti righe sarebbe un muro. */
.verdetto { grid-column: 2 / -1; margin-top: 0.5rem; }
.verdetto > summary {
  font-size: var(--t-sm); color: var(--ink-soft);
  cursor: pointer; list-style: none; width: fit-content;
  border-bottom: 1px solid var(--rule-strong); padding-bottom: 0.0625rem;
}
.verdetto > summary::-webkit-details-marker { display: none; }
.verdetto > summary:hover { color: var(--ink); }
.verdetto[open] > summary { margin-bottom: 0.75rem; }
.verdetto .sintesi { font-size: var(--t-sm); line-height: 1.55; margin: 0 0 0.75rem; max-width: 68ch; }

.req { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr); gap: 0 0.625rem; padding: 0.4375rem 0; border-top: 1px solid var(--rule); }
/* Il segno è geometrico e la parola lo ripete: lo stato si legge anche senza
   distinguere i colori, e si legge ad alta voce. */
.req .mark { font: 400 var(--t-sm)/1.5 var(--mono); color: var(--ink-soft); text-align: center; }
.req q { font-size: var(--t-sm); line-height: 1.5; quotes: '"' '"'; }
.req .nota { font-size: var(--t-xs); color: var(--ink-soft); line-height: 1.5; margin-top: 0.125rem; }
.req .nota b { font-weight: 620; color: var(--ink); }

.agganci { margin-top: 0.875rem; border-top: 1px solid var(--rule-strong); padding-top: 0.625rem; }
.agganci h4 { font: 500 var(--t-xs)/1 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 0.5rem; }
.agganci li { font-size: var(--t-sm); line-height: 1.55; margin-bottom: 0.375rem; max-width: 68ch; }
.agganci li span { color: var(--ink-soft); }

.who { min-width: 0; }
.who .top { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
.who .co {
  font-weight: 640; font-size: var(--t-base);
  color: inherit; text-decoration: none;
  border-bottom: 1px solid var(--rule-strong);
}
.who .co:hover { border-bottom-color: var(--accent); color: var(--accent); }
.who .role { font-size: var(--t-base); color: var(--ink-soft); }
.who .meta {
  font-size: var(--t-xs); color: var(--ink-faint);
  margin-top: 0.1875rem;
  display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: baseline;
}
.who .meta .sep { color: var(--rule-strong); }
.who .line {
  font-size: var(--t-sm); color: var(--ink-soft);
  margin-top: 0.4375rem; max-width: 72ch;
}

/* Ogni stato porta la parola. Il segno geometrico la raddoppia per chi
   non distingue i colori; nessuno dei due è il colore. */
.state {
  display: inline-flex; align-items: center; gap: 0.375rem;
  font-size: var(--t-xs); font-weight: 600;
  letter-spacing: 0.03em;
}
.state::before {
  content: ""; width: 0.5rem; height: 0.5rem;
  border: 1.5px solid var(--ink-soft);
}
.state[data-k="queued"]::before    { background: var(--ink-soft); }
.state[data-k="partial"]::before   { background: linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); }
.state[data-k="skipped"]::before   { border-radius: 50%; background: none; }
.state[data-k="submitted"]::before { background: var(--ink); border-color: var(--ink); border-radius: 50%; }
.state[data-k="dead"]::before      { background: repeating-linear-gradient(45deg, var(--ink-faint) 0 2px, transparent 2px 4px); }

.pick { display: flex; gap: 0.3125rem; align-items: center; padding-top: 0.0625rem; }
.pick button { padding: 0.4375rem 0.6875rem; font-size: var(--t-xs); }
.pick button.primary { background: var(--paper-raised); border-color: var(--accent); color: var(--accent); }
.pick button.primary:hover:not(:disabled) { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-press); }
.pick button[aria-pressed="true"] {
  background: var(--ink); border-color: var(--ink); color: var(--paper);
}

/* --------------------------------------------------------------------------
   Stati vuoti — insegnano, non constatano
   -------------------------------------------------------------------------- */
.blank { padding: 3.5rem 0 4rem; max-width: 58ch; }
.blank h2 { margin: 0 0 0.625rem; font-size: var(--t-lg); font-weight: 620; letter-spacing: -0.012em; }
.blank p { margin: 0 0 1.125rem; color: var(--ink-soft); }
.blank ol { margin: 0 0 1.5rem; padding-left: 1.25rem; color: var(--ink-soft); }
.blank ol li { margin-bottom: 0.375rem; }
.blank ol li b { color: var(--ink); font-weight: 600; }

/* Scheletro di caricamento, non rotella in mezzo al contenuto */
.skel { border-bottom: 1px solid var(--rule); padding: 0.9375rem 0; display: grid; grid-template-columns: 3.25rem 1fr; gap: 1rem; }
.skel i { display: block; height: 0.6875rem; border-radius: 2px; background: var(--rule); }
.skel i + i { margin-top: 0.5rem; width: 62%; }
.skel i:first-child { width: 2.25rem; margin-left: auto; }

footer {
  border-top: 1px solid var(--rule);
  padding: 1.5rem 0 3rem;
  font-size: var(--t-xs); color: var(--ink-faint);
  max-width: 72ch;
}
footer b { color: var(--ink-soft); font-weight: 620; }

@media (max-width: 56rem) {
  .rail { grid-template-columns: repeat(2, 1fr); }
  .verdetto dt { flex-basis: auto; }
  .row { grid-template-columns: 2.75rem minmax(0, 1fr); }
  .pick { grid-column: 1 / -1; padding-top: 0.75rem; flex-wrap: wrap; }
  .fact { flex-direction: column; gap: 0.1875rem; }
  .fact dt { flex-basis: auto; }
}
</style>
</head>
<body>

<header class="board">
  <div class="wrap">
    <div class="board-head">
      <h1>Pannello candidature</h1>
      <span class="sub" id="sub">carico…</span>
      <span class="spacer"></span>
      <button class="quiet" id="restore" hidden>Ripristina</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="rail" id="rail" aria-label="Le quattro fasi"></div>
  <div class="act" id="act"></div>

  <div id="confirm"></div>
  <div id="console"></div>
  <div id="fail"></div>
  <div id="list"></div>

  <footer>
    <b>L'invio non avviene qui.</b> L'ultima fase apre l'annuncio in un browser vero
    con i campi riempiti solo dove esiste una fonte, e si ferma. Il bottone di invio
    lo premi tu, sul sito dell'azienda, dopo aver guardato.
  </footer>
</main>

<script>
'use strict';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

let state = null;
let pending = null;   // conferma in attesa
let poll = null;      // id dell'intervallo di polling
let busy = false;
// La fase su cui punta la barra azione. Parte da quella consigliata, ma la
// plancia può spostarla su qualunque altra.
let selected = null;

// Una casella, un numero. Due numeri per casella obbligavano a leggere invece
// che a guardare, ed era il contrario del punto di una plancia.
const STAGES = [
  { id: 'search', name: 'Cerca',     count: (s) => `${s.inPlay} in gioco` },
  { id: 'triage', name: 'Valuta',    count: (s) => `${s.readyToTriage} da valutare` },
  { id: 'deep',   name: 'Analizza',  count: (s) => `${s.toAnalyse} da leggere` },
  { id: 'packs',  name: 'Documenti', count: (s) => `${s.packsBuilt} pronti` },
  { id: 'form',   name: 'Compila',   count: (s) => `${s.submitted} inviate` },
];

// Il livello di rischio va detto a parole: "medium" non significa niente per
// chi legge, e il colore non può portarlo da solo.
const RISK = {
  low: 'basso — tocca solo file di lavoro, si torna indietro',
  medium: 'medio — consuma token e riscrive i punteggi in coda',
  high: 'alto — apre un sito esterno e digita nei suoi campi. Non invia.',
};

/**
 * Una parola sola per la località.
 *
 * "United States · Ireland · Spain · Australia · Japan · Brazil · Italy ·
 * Poland · ..." occupava due righe e non rispondeva alla sola domanda che conta:
 * ci arrivo da Milano? L'elenco completo resta, come suggerimento al passaggio
 * del mouse.
 */
function dove(loc) {
  const l = String(loc || '');
  if (!l.trim()) return '';
  if (/milan/i.test(l)) return 'Milano';
  if (/ital/i.test(l)) return 'Italia';
  if (/europ|emea|ireland|spain|poland|german|france|paris|berlin|london|united kingdom|portugal|netherlands|serbia/i.test(l)) return 'Europa';
  if (/remote/i.test(l)) return 'Remoto';
  return 'Fuori Europa';
}

const STATE_WORD = {
  chosen: 'scelto', partial: 'solo documenti', skipped: 'ignorato',
  submitted: 'inviato', dead: 'chiuso',
};

async function api(path, opts) {
  const res = await fetch(path, {
    method: opts ? 'POST' : 'GET',
    headers: opts ? { 'Content-Type': 'application/json' } : undefined,
    body: opts ? JSON.stringify(opts) : undefined,
  });
  return { status: res.status, body: await res.json() };
}

// ---------------------------------------------------------------------------
// Plancia
// ---------------------------------------------------------------------------

/**
 * Ogni casella della plancia sceglie la sua fase.
 *
 * Prima la barra mostrava solo il bottone del passo consigliato, e quello
 * rendeva irraggiungibili gli altri tre: non si poteva rilanciare una ricerca
 * finché c'erano annunci da valutare. Il consiglio resta, ma non è più un
 * cancello.
 */
function drawRail() {
  const s = state.stats;
  $('rail').innerHTML = STAGES.map((st, i) => `
    <button class="stage" data-stage="${esc(st.id)}"
            data-current="${state.next === st.id ? 'yes' : 'no'}"
            aria-pressed="${selected === st.id}">
      <span class="stage-top">
        <span class="stage-idx">0${i + 1}</span>
        <span class="stage-name">${esc(st.name)}</span>
      </span>
      <span class="stage-count">${esc(st.count(s))}</span>
      ${state.next === st.id ? '<span class="stage-flag">prossimo passo</span>' : ''}
    </button>`).join('');

  document.querySelectorAll('[data-stage]').forEach((b) => b.addEventListener('click', () => {
    selected = b.dataset.stage;
    $('confirm').innerHTML = '';
    drawRail();
    drawAct();
  }));
}

// Una frase che dice cosa succede, non il nome interno della fase.
const SPIEGA = {
  search: () => focusLabels().length
    ? `Cerca sui portali e tiene solo gli annunci che parlano di: ${focusLabels().join(' + ')}. Non costa niente.`
    : 'Cerca annunci nuovi sui portali, tutti. Non costa niente.',
  triage: (s) => {
    const n = quanti === null ? s.readyToTriage : quanti;
    if (n === 0) return 'Con zero non valuta niente. Scrivi quanti annunci vuoi valutare.';
    if (n === 1) return 'Dà un voto al primo annuncio della lista e scrive la sua riga di CV.';
    return `Dà un voto a ${n} annunci e scrive la riga di CV per ognuno. Una richiesta sola per tutti.`;
  },
  deep: (s) => {
    const n = quanti === null ? s.toAnalyse : Math.min(quanti, s.toAnalyse);
    if (s.toAnalyse === 0) return 'Nessun annuncio da leggere a fondo. Ci passano quelli con voto 3 o più.';
    if (n === 0) return 'Con zero non legge niente. Scrivi quanti annunci vuoi far leggere.';
    if (n === 1) return 'Legge un annuncio per intero: requisiti citati, quanto ci sei vicino, cosa può dire la lettera. Una richiesta, quindi token.';
    return `Legge ${n} annunci per intero, uno per richiesta. Token: si paga per annuncio, non a giro.`;
  },
  packs:  (s) => `Prepara CV e lettera per ${s.packsTodo} annunci. Non costa niente.`,
  form:   () => 'Apre il modulo compilato in una finestra del browser. Non invia.',
};

// I filtri pronti. Ogni voce elenca i modi in cui un annuncio può soddisfarla,
// separati da `|`: gli annunci sono per lo più in inglese ma non tutti, e
// "part time" e "tempo parziale" sono la stessa richiesta scritta in due
// lingue. Le voci spuntate nella stessa riga si sommano come alternative,
// quindi Part time + Full time vuol dire "uno dei due", non "nessuno".
const FILTRI = [
  { nome: 'Orario', voci: [
    { id: 'part', label: 'Part time', term: 'part time | tempo parziale' },
    { id: 'full', label: 'Full time', term: 'full time | tempo pieno' },
  ] },
  { nome: 'Dove', voci: [
    { id: 'remoto', label: 'Da remoto', term: 'remote | remoto | smart working | telelavoro' },
    { id: 'ibrido', label: 'Ibrido', term: 'hybrid | ibrido' },
    { id: 'milano', label: 'Milano', term: 'milan | milano' },
    { id: 'italia', label: 'Italia', term: 'ital' },
  ] },
  { nome: 'Contratto', voci: [
    { id: 'stage', label: 'Stage', term: 'internship | stage | tirocinio' },
    { id: 'appr', label: 'Apprendistato', term: 'apprenticeship | apprendistato' },
    { id: 'indet', label: 'Indeterminato', term: 'permanent | indeterminato' },
    { id: 'freelance', label: 'Freelance', term: 'freelance | contractor | partita iva' },
  ] },
  { nome: 'Livello', voci: [
    { id: 'junior', label: 'Junior', term: 'junior | entry level | graduate | neolaureat' },
    { id: 'noexp', label: 'Senza esperienza', term: 'no experience | no prior experience | nessuna esperienza | senza esperienza' },
  ] },
];

// Quanti annunci valutare al prossimo giro. null vuol dire "tutti quelli
// pronti": è il valore di partenza, non una scelta fatta.
let quanti = null;

// Quali filtri sono spuntati. Sopravvive alla chiusura del browser: una
// ricerca impostata bene non si reimposta ogni volta.
let scelti = new Set();
try { scelti = new Set(JSON.parse(localStorage.getItem('career-ops-filtri') || '[]')); } catch { scelti = new Set(); }

function ricorda() {
  try {
    localStorage.setItem('career-ops-filtri', JSON.stringify([...scelti]));
    localStorage.setItem('career-ops-focus', focus);
  } catch { /* sessione privata: pazienza */ }
}

// La richiesta completa: una riga di filtri spuntati diventa un gruppo di
// alternative, le parole scritte a mano si aggiungono come gruppi a sé.
function composeFocus() {
  const gruppi = FILTRI
    .map((f) => f.voci.filter((v) => scelti.has(v.id)).map((v) => v.term).join(' | '))
    .filter(Boolean);
  const libere = focus.split(',').map((t) => t.trim()).filter(Boolean);
  return [...gruppi, ...libere].join(', ');
}

// Come si dice a voce: le etichette dei filtri, non le loro alternative.
function focusLabels() {
  const dai = FILTRI.flatMap((f) => f.voci.filter((v) => scelti.has(v.id)).map((v) => v.label.toLowerCase()));
  return [...dai, ...focus.split(',').map((t) => t.trim()).filter(Boolean)];
}

// Quello che l'utente ha scritto nel campo focus, anche quando il campo non è
// sullo schermo: cambiare fase e tornare indietro non deve cancellarlo.
let focus = '';
try { focus = localStorage.getItem('career-ops-focus') || ''; } catch { focus = ''; }

function drawAct() {
  const id = selected || state.next || 'search';
  const phase = state.phases.find((p) => p.id === id);
  const s = state.stats;

  const disponibili = id === 'triage' ? s.readyToTriage : s.toAnalyse;
  const qty = (id === 'triage' || id === 'deep') && disponibili > 0
    ? `<span class="qty"><label for="lim">quanti</label>
       <input id="lim" type="number" min="1" max="${Math.max(1, disponibili)}"
              value="${quanti === null ? Math.max(1, disponibili) : quanti}"></span>`
    : '';
  const foc = id === 'search'
    ? `<div class="filtri">
        ${FILTRI.map((f) => `
          <div class="frow" role="group" aria-label="${esc(f.nome)}">
            <span class="fname">${esc(f.nome)}</span>
            ${f.voci.map((v) => `<button class="chip" data-chip="${esc(v.id)}"
                aria-pressed="${scelti.has(v.id)}">${esc(v.label)}</button>`).join('')}
          </div>`).join('')}
        <div class="frow">
          <span class="fname">Altro</span>
          <span class="focus"><label class="sr" for="foc">altre parole da cercare</label>
            <input id="foc" type="text" value="${esc(focus)}"
                   placeholder="altre parole: marketing, social — separale con la virgola"
                   autocomplete="off" spellcheck="false"></span>
        </div>
      </div>`
    : '';

  $('act').innerHTML = `
    <span class="act-say">${esc(SPIEGA[id](s))}</span>
    ${qty}
    <button class="primary" data-run="${esc(id)}">${esc(phase ? phase.label : id)}</button>
    ${foc}`;

  const qEl = $('lim');
  if (qEl) {
    // Il campo arriva pieno. Chi ne vuole uno solo non deve prima cancellare
    // un numero a due cifre: al primo clic il valore è già selezionato.
    qEl.addEventListener('focus', () => qEl.select());
    // Il mouseup che segue il clic annullerebbe la selezione appena fatta.
    qEl.addEventListener('mouseup', (e) => e.preventDefault());
    qEl.addEventListener('input', () => {
      quanti = qEl.value === '' ? null : Math.max(0, Number(qEl.value) || 0);
      $('act').querySelector('.act-say').textContent = SPIEGA[id](s);
    });
    qEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') askConfirm(id); });
  }

  const fEl = $('foc');
  if (fEl) {
    fEl.addEventListener('input', () => {
      focus = fEl.value;
      ricorda();
      $('act').querySelector('.act-say').textContent = SPIEGA.search(s);
    });
    fEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') askConfirm('search'); });
  }

  document.querySelectorAll('[data-chip]').forEach((b) => {
    b.addEventListener('click', () => {
      const key = b.dataset.chip;
      if (scelti.has(key)) scelti.delete(key); else scelti.add(key);
      ricorda();
      b.setAttribute('aria-pressed', String(scelti.has(key)));
      $('act').querySelector('.act-say').textContent = SPIEGA.search(s);
    });
  });

  $('restore').hidden = !state.canRestore;
  document.querySelectorAll('[data-run]').forEach((b) => {
    b.disabled = busy;
    b.addEventListener('click', () => askConfirm(b.dataset.run));
  });
}

// ---------------------------------------------------------------------------
// Conferma
// ---------------------------------------------------------------------------

function limitValue() {
  const el = $('lim');
  return el ? Math.max(0, Number(el.value) || 0) : undefined;
}

async function askConfirm(phaseId) {
  const limit = phaseId === 'triage' || phaseId === 'deep' ? limitValue() : undefined;
  const foc = phaseId === 'search' ? composeFocus() : undefined;
  const { body } = await api('/api/preflight', { phase: phaseId, limit, focus: foc });
  pending = { phase: phaseId, limit, focus: foc };
  drawConfirm(body);
}

function drawConfirm(p) {
  $('fail').innerHTML = '';
  $('confirm').innerHTML = `
    <section class="confirm" role="alertdialog" aria-labelledby="ct">
      <div class="confirm-head">Conferma prima di procedere</div>
      <div class="confirm-body">
        <h3 id="ct">${esc(p.label)}</h3>
        <p>${esc(p.blurb)}</p>
        <dl class="facts">
          <div class="fact"><dt>Su cosa agisce</dt><dd>${esc(p.affects)}</dd></div>
          <div class="fact"><dt>File che tocca</dt><dd>${(p.writes || []).map((w) => `<code>${esc(w)}</code>`).join(' ')}</dd></div>
          <div class="fact"><dt>Costo</dt><dd>${esc(p.cost || '—')}${p.model ? ` · modello <b>${esc(p.model)}</b>` : ''}</dd></div>
          <div class="fact"><dt>Rischio</dt><dd>${esc(RISK[p.risk] || p.risk || '—')}</dd></div>
          <div class="fact"><dt>Si torna indietro</dt><dd>${p.reversible === false ? 'No' : esc(p.rollback || 'Sì')}</dd></div>
        </dl>
        ${p.warning ? `<div class="warn"><b>Attenzione.</b> ${esc(p.warning)}</div>` : ''}
        <div class="confirm-actions">
          <button class="primary" id="go">Procedi</button>
          <button id="no">Annulla</button>
        </div>
      </div>
    </section>`;
  $('go').addEventListener('click', go);
  $('no').addEventListener('click', () => { pending = null; $('confirm').innerHTML = ''; });
  $('go').focus();
}

// ---------------------------------------------------------------------------
// Esecuzione
// ---------------------------------------------------------------------------

async function go() {
  if (!pending) return;
  const req = pending;
  pending = null;
  $('confirm').innerHTML = '';
  busy = true;
  drawAct();

  if (req.phase === 'restore') {
    await api('/api/restore', { confirm: true });
    busy = false;
    return refresh();
  }

  const { body } = await api('/api/run', { phase: req.phase, limit: req.limit, focus: req.focus, confirm: true });
  if (!body.runId) { busy = false; return refresh(); }
  watch(body.runId);
}

function watch(runId) {
  clearInterval(poll);
  poll = setInterval(async () => {
    const { body } = await api(`/api/run/${runId}`);
    drawConsole(body);
    if (body.status === 'running') return;
    clearInterval(poll);
    busy = false;
    if (body.status === 'error') drawFail(body.error);
    refresh();
  }, 700);
}

function drawConsole(run) {
  const phase = state.phases.find((p) => p.id === run.phase);
  const lines = run.lines || [];
  const word = run.status === 'running' ? 'in corso' : run.status === 'done' ? 'finito' : 'fermato';
  $('console').innerHTML = `
    <section class="console">
      <div class="console-head">
        <span>${esc(phase ? phase.label : run.phase)}</span>
        <span>·</span>
        <span>${word}</span>
      </div>
      <div class="console-log" id="clog">${lines.map((l, i) =>
        `<span class="${i === lines.length - 1 && run.status === 'running' ? 'cur' : ''}">${esc(l)}</span>`
      ).join('\n')}</div>
    </section>`;
  const log = $('clog');
  if (log) log.scrollTop = log.scrollHeight;
}

function drawFail(e) {
  if (!e) return;
  $('fail').innerHTML = `
    <section class="fail" role="alert">
      <div class="fail-head">
        <span>Si è fermato</span>
        <span class="tag">${e.blocking ? 'blocca il resto' : 'non blocca il resto'}</span>
        <span class="tag">fase: ${esc(e.phaseLabel)}</span>
        ${e.step ? `<span class="tag">passo: ${esc(e.step)}</span>` : ''}
      </div>
      <div class="fail-body">
        <h3>${esc(e.explain)}</h3>
        <p class="say">${esc(e.message)}</p>
        <dl class="facts">
          <div class="fact"><dt>File coinvolti</dt><dd>${(e.files || []).map((f) => `<code>${esc(f)}</code>`).join(' ') || '—'}</dd></div>
        </dl>
        <p class="hint"><b>Cosa conviene fare.</b> ${esc(e.hint)}</p>
        <div class="confirm-actions">
          ${(e.actions || []).includes('riprova') ? `<button class="primary" data-fix="riprova">Riprova</button>` : ''}
          ${(e.actions || []).includes('ripristina') ? `<button data-fix="ripristina">Ripristina</button>` : ''}
          <button class="quiet" data-fix="chiudi">Chiudi</button>
        </div>
        <details class="raw"><summary>Log completo</summary><pre>${esc(e.output || '')}</pre></details>
      </div>
    </section>`;

  document.querySelectorAll('[data-fix]').forEach((b) => b.addEventListener('click', () => {
    const what = b.dataset.fix;
    $('fail').innerHTML = '';
    if (what === 'riprova') askConfirm(e.phase);
    if (what === 'ripristina') askRestore();
  }));
}

async function askRestore() {
  const { body } = await api('/api/restore', {});
  pending = { phase: 'restore' };
  drawConfirm(body);
}

// ---------------------------------------------------------------------------
// Ruoli
// ---------------------------------------------------------------------------

// L'ordine è quello dell'attenzione: prima ciò che aspetta te.
const GROUPS = [
  { key: 'decide',  title: 'Da decidere' },
  { key: 'chosen',  title: 'Scelti' },
  { key: 'waiting', title: 'Non valutati' },
  { key: 'out',     title: 'Fuori' },
];

function bucket(r) {
  if (r.apply === 'submitted') return 'chosen';
  if (r.apply === 'skipped' || r.apply === 'dead' || r.pack === 'jd_failed') return 'out';
  if (r.apply === 'chosen' || r.apply === 'partial') return 'chosen';
  if (r.score === '' || r.score === null) return 'waiting';
  return Number(r.score) >= 3 ? 'decide' : 'out';
}

function drawList() {
  if (!state.rows.length) return drawBlank();

  const by = { decide: [], chosen: [], waiting: [], out: [] };
  state.rows.forEach((r) => by[bucket(r)].push(r));

  // "Fuori" è un archivio, non una superficie di lavoro: novantuno righe
  // scartate in cima alla pagina sono rumore, e con un bottone ciascuna erano
  // novantuno inviti a rifare un lavoro già fatto. Resta raggiungibile, chiuso.
  $('list').innerHTML = GROUPS.filter((g) => by[g.key].length).map((g) => {
    const head = `<div class="group-head"><h2>${esc(g.title)}</h2><span class="n">${by[g.key].length}</span></div>`;
    const body = by[g.key].map(rowHtml).join('');
    return g.key === 'out'
      ? `<details class="group"><summary>${head}</summary>${body}</details>`
      : `<section class="group">${head}${body}</section>`;
  }).join('');

  document.querySelectorAll('[data-decide]').forEach((b) => b.addEventListener('click', async () => {
    b.disabled = true;
    await api('/api/decide', { slug: b.dataset.slug, decision: b.dataset.decide });
    refresh();
  }));

  document.querySelectorAll('[data-lettura]').forEach((d) => d.addEventListener('toggle', () => {
    if (d.open) apriLettura(d);
  }));
}

/**
 * I bottoni di decisione compaiono solo quando c'è un voto.
 *
 * Prima comparivano su ogni riga: ventuno annunci senza voto significavano
 * ottantaquattro bottoni che chiedevano di decidere senza l'unica informazione
 * che serve per decidere. Quel lavoro è esattamente ciò che la fase Valuta
 * esiste per toglierti.
 */
function azioni(r) {
  const scored = r.score !== '' && r.score !== null;

  if (r.apply === 'skipped') {
    return `<button data-decide="apply" data-slug="${esc(r.slug)}">Rimetti in gioco</button>`;
  }
  if (!scored) return '';

  return `
    <button class="primary" data-decide="apply" data-slug="${esc(r.slug)}" aria-pressed="${r.apply === 'chosen'}">Candidati</button>
    <button data-decide="partial" data-slug="${esc(r.slug)}" aria-pressed="${r.apply === 'partial'}">Solo documenti</button>
    <button class="quiet" data-decide="skip" data-slug="${esc(r.slug)}" aria-pressed="${r.apply === 'skipped'}">Ignora</button>`;
}

// Quando l'annuncio è stato letto per intero, il voto da 1 a 5 lascia il posto
// al suo risultato: due numeri sulla stessa riga sarebbero due verdetti, e chi
// legge non saprebbe a quale credere. Il voto resta nel suggerimento.
function verdetto(r) {
  if (!r.fit) {
    const none = r.score === '' || r.score === null;
    return `<div class="score" data-none="${none ? 'yes' : 'no'}">${none ? '' : esc(Number(r.score).toFixed(1))}</div>`;
  }
  const voto = r.score === '' ? '' : ` · voto ${Number(r.score).toFixed(1)}`;
  if (r.fit.blocked) {
    return `<div class="score" data-none="no" data-kind="blocked"
      title="Requisito bloccante non soddisfatto${esc(voto)}">no</div>`;
  }
  return `<div class="score" data-none="no" data-kind="fit"
    title="${r.fit.total} requisiti letti${esc(voto)}">${r.fit.percent}%</div>`;
}

const SEGNO = {
  soddisfatto:        { mark: '●', parola: 'sì' },
  parziale:           { mark: '◐', parola: 'in parte' },
  'non soddisfatto':  { mark: '○', parola: 'no' },
};

function rowHtml(r) {
  const state_ = STATE_WORD[r.apply];
  const luogo = dove(r.location);
  return `
  <article class="row">
    ${verdetto(r)}
    <div class="who">
      <div class="top">
        <a class="co" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.company || 'Azienda ignota')}</a>
        <span class="role">${esc(r.role || 'ruolo ignoto')}</span>
      </div>
      <div class="meta">
        ${luogo ? `<span title="${esc(r.location)}">${esc(luogo)}</span>` : ''}
        ${!r.jd ? `${luogo ? '<span class="sep">/</span>' : ''}<span>non leggibile</span>` : ''}
        ${state_ ? `${luogo || !r.jd ? '<span class="sep">/</span>' : ''}<span class="state" data-k="${esc(r.apply)}">${esc(state_)}</span>` : ''}
      </div>
      ${r.summary_line && r.summary_line !== 'n/a' ? `<p class="line">${esc(r.summary_line)}</p>` : ''}
    </div>
    <div class="pick">${azioni(r)}</div>
    ${r.fit ? `
    <details class="verdetto" data-lettura="${esc(r.slug)}">
      <summary>${r.fit.blocked
        ? `Non raggiungibile: ${esc(r.fit.blockers[0] || 'requisito bloccante')}`
        : `Perché ${r.fit.percent}% — leggi i ${r.fit.total} requisiti`}</summary>
      <div class="lettura">Apro…</div>
    </details>` : ''}
  </article>`;
}

/**
 * Load one analysis the first time its block is opened.
 *
 * Twenty analyses shipped with the board would be a payload nobody reads; one
 * fetch on demand is the same data at the moment it is wanted.
 */
async function apriLettura(det) {
  const box = det.querySelector('.lettura');
  if (det.dataset.caricata === 'yes') return;
  det.dataset.caricata = 'yes';
  const { body, status } = await api(`/api/analysis/${encodeURIComponent(det.dataset.lettura)}`);
  if (status !== 200) { box.textContent = 'Questa analisi non si trova più sul disco.'; return; }

  const reqs = (body.requisiti || []).map((q) => {
    const seg = SEGNO[q.stato] || { mark: '·', parola: q.stato };
    return `<div class="req">
      <div class="mark" aria-hidden="true">${seg.mark}</div>
      <div>
        <q>${esc(q.testo)}</q>
        <p class="nota"><b>${esc(seg.parola)}</b>${q.bloccante ? ' · bloccante' : ''}${q.perche ? ` — ${esc(q.perche)}` : ''}</p>
      </div>
    </div>`;
  }).join('');

  const ag = (body.agganci || []).length
    ? `<div class="agganci"><h4>Cosa può dire la lettera</h4><ul>${
        body.agganci.map((a) => `<li>${esc(a.punto)} <span>← ${esc(a.fatto)}</span></li>`).join('')
      }</ul></div>`
    : `<div class="agganci"><h4>Cosa può dire la lettera</h4>
       <p class="nota">Niente che regga su un fatto vero. La lettera qui non ha appigli.</p></div>`;

  box.innerHTML = `${body.sintesi ? `<p class="sintesi">${esc(body.sintesi)}</p>` : ''}${reqs}${ag}`;
}

      <p>Il pannello lavora su cinque fasi in fila. Ognuna dice cosa farà prima di partire.</p>
      <ol>
        <li><b>Cerca</b> interroga i portali e scarica il testo degli annunci. Non costa token.</li>
        <li><b>Valuta</b> dà un punteggio a ciascuno e scrive la riga da mettere in cima al CV.</li>
        <li><b>Analizza</b> rilegge per intero quelli passati, e dice cosa chiedono davvero.</li>
        <li><b>Documenti</b> genera CV e lettera per quelli sopra soglia.</li>
        <li><b>Compila</b> apre il form riempito. L'invio resta tuo.</li>
      </ol>
      <p>Parti dalla prima.</p>

}

function drawSkeleton() {

    '<div class="skel"><i></i><div><i></i><i></i></div></div>'.repeat(4)
  }</section>`;
}
